# Pinned inputs for THIRD_PARTY_LICENSES.
# python3 scripts/licence_check.py binaries checks every sha256 in this file.
# Gate time reads these files. It does not fetch.
# python3 scripts/licence_check.py verify-upstream re-fetches every crate pin
# and every earlier pin from its recorded URL at its recorded commit. It does
# not re-fetch the MIT, Apache-2.0, Zlib or rust-std rows. It is not a gate.
#
# SPDX license-list-data was assessed on 2026-11-05 at tag v3.29.0 and not
# used. The tag root has no LICENSE, LICENCE, COPYING or NOTICE file. GitHub
# reports no licence. docs/SOURCE-POLICY.md records that refusal.
#
# MIT template. The terms follow _licenses/mit.txt in
# github/choosealicense.com on the gh-pages branch. That file is project
# content. The content is licensed under Creative Commons Attribution 3.0
# Unported. https://creativecommons.org/licenses/by/3.0/
# Attribution: GitHub, title choosealicense.com, file _licenses/mit.txt,
# https://github.com/github/choosealicense.com/blob/gh-pages/_licenses/mit.txt.
# The change from that file is the copyright line, which is one marker.
# The generator fills the marker per crate. The sha256 is of this template.
# The source code of that repository is MIT and is not what was copied.
#
# Apache-2.0. The Apache Software Foundation publishes
# https://www.apache.org/licenses/LICENSE-2.0.txt
# This file is that text. The generator never fills its appendix line.
#
# Zlib template. The terms follow madler/zlib tag v1.3.1 file LICENSE.
# That file is the zlib library's grant. This template keeps the terms,
# omits that project's copyright line and sign-off, and carries one marker.
# The sha256 is of this template.
#
# Rust standard library. The rust-docs component for the recorded toolchain
# installs share/doc/rust/COPYRIGHT-library.html.
#
# Crate rows. Each row is a crate whose package ships no licence file.
# The path is a file from that crate's repository at the package's
# published commit. The url is that file at that commit. The sha256 is
# of the pinned bytes. A url commit that differs from the package's
# published commit is a refusal. The published commit is the sha1 in
# .cargo_vcs_info.json in the registry cache. The check reads that file
# and does not use the network.
#
# madsmtm/objc2. At the published commit of each locked crate the
# repository holds LICENSE.md and no licence text. LICENSE.md states the
# licence expressions and names no holder. Each crate row pins LICENSE.md
# from that commit. The notice reproduces LICENSE.md, then the elected
# template. The fallback rows record that reason for each crate.
# The four MIT-only crates also reproduce the repository root LICENSE.txt
# from the parent of commit cfb19922. That file names Copyright (c)
# Steven Sheldon. Those rows are the earlier table. They are not the
# published-commit pin.

