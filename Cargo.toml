[workspace]
resolver = "3"
members = ["crates/*", "tools/oracle"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# HLD section 15.2 gives 1.85, the dicom-rs MSRV floor. We pin 1.97.1, which
# is above that floor so the floor is still satisfied. Recorded as D-01 in
# docs/hld/DEVIATIONS.md.
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensorbee/ocelli"
authors = ["Tensorbee"]

# HLD section 27.1. The dangerous defect class in this project is arithmetic,
# and `as` casts are where silent arithmetic errors live. Every conversion
# should be a deliberate, visible choice.
[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
indexing_slicing = "warn"
# Not from section 27.1. These follow from section 23's panic policy: a panic
# inside WebAssembly poisons the module instance, so a panic reachable from an
# exported function is a defect and not an error path. Denying the three
# common ways one arrives is cheaper than finding it at runtime.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# HLD section 15.2's dependency list, no longer verbatim. Section 15.2 gives
# five entries and this block has more.
#
# THE COUNT IS NOT WRITTEN HERE, DELIBERATELY. It said seven while the block
# held eight from the day it was written, because `wasm-bindgen` is a departure
# the sentence never named, and S03 took it to twelve without the sentence
# moving: `pollster` in 9df8539, then `serde`, `serde_json` and `sha2` in
# 2ffabe3. Eight review passes read past it. A number in a comment beside a
# list is stale the next time the list grows, and this list grows every sprint.
#
#   awk '/^\[workspace.dependencies\]/{f=1;next} /^\[/{f=0} f' Cargo.toml \
#     | grep -cE '^[a-z0-9_-]+ ='
#
# prints how many there are. The rule that carries the weight instead is that
# EVERY DEPARTURE IS COMMENTED AT THE ENTRY IT BELONGS TO, which is checkable
# by reading down this block and needs no arithmetic. The `[profile.release]`
# block further down is still verbatim and still says so.
#
# The exact wgpu pin is not fussiness: agents reliably emit wgpu 0.19-era
# pipeline code, and a caret range lets that compile against something subtly
# different from what the shader expects.
#
# Cargo does not resolve an unused workspace dependency, so an entry costs
# nothing until a crate names it. Each activates with the story that needs it,
# F-016 for dicom-rs and F-008 for wgpu. F-001 activates glam, for the
# `Transform<A, B>` matrix of HLD section 16, and F-002 activates wasm-bindgen.
#
# wgpu moved from F-037 to F-008 under deviation D-10: HLD section 38's
# device-sharing hook is stated in wgpu types, and a contract expressed only in
# prose is not a mechanism. This comment said F-039 until the S03 review's
# fifth pass, and D-10's row in docs/hld/DEVIATIONS.md quotes that spelling
# rather than endorsing it. F-037 is E6.1 in S11, device init and capability
# tiering, and it is the story that would otherwise have needed wgpu first.
# F-039 is E6.3 in S13 and is OffscreenCanvas.
[workspace.dependencies]
wgpu = "=30.0.1"
# Pinned EXACTLY for the same reason as wgpu and one more that is specific to
# it: `wasm-pack` runs a wasm-bindgen CLI whose version must match this crate
# version, so a floating range produces a version-mismatch failure that reads
# as a build break rather than as a resolution change. Activated by F-002,
# which is the story that makes wasm32 a real build target.
wasm-bindgen = "=0.2.127"
# D-18. dicom 0.10's umbrella does not expose the codec features HLD section
# 15.2 names and enables transfer-syntax-registry defaults through its own
# dependency. Direct components keep defaults off on native and wasm. F-016
# enables only whole-data-set deflate and uses the parser's strict lazy pass.
# A direct flate2 handle exposes the consumed stream length that dicom-rs's
# erased adapter does not, so mandatory A.5 padding can be validated. Pixel
# codecs remain for F-023 onward.
dicom-core = { version = "0.10", default-features = false }
dicom-object = { version = "0.10", default-features = false, features = ["deflate"] }
dicom-encoding = { version = "0.10", default-features = false }
dicom-parser = { version = "0.10", default-features = false }
dicom-transfer-syntax-registry = { version = "0.10", default-features = false, features = ["deflate"] }
flate2 = { version = "1.0.28", default-features = false, features = ["rust_backend"] }
# F-024. JPEG Baseline and lossless use the dependency's single-threaded
# pure-Rust path. The default feature enables rayon, which is neither needed
# by decode workers nor suitable for the wasm target.
jpeg-decoder = { version = "=0.3.2", default-features = false }
# F-024 and D-21. The published 0.1.8 standalone decode entry point is not
# public despite its crate documentation, so the explicitly enabled registry
# feature is the smallest public route to its 12-bit SOF1 decoder. Defaults
# remain disabled and only that named feature is restored.
oxideav-mjpeg = { version = "=0.1.8", default-features = false, features = ["registry"] }
# Exact public API companion selected by oxideav-mjpeg's registry feature.
# Its external arena code's eleven unsafe sites are audited in the F-024 plan.
oxideav-core = { version = "=0.1.35", default-features = false }
# F-021 validates absolute and relative Content-Location URI references from
# PS3.18 multipart resource headers without retaining their spelling.
uriparse = "0.6.4"
# HLD section 15.2 writes `glam = "0.30"`. The version is untouched and only
# the feature set differs, which is deviation D-09: every core crate carries
# `#![cfg_attr(not(test), no_std)]`, glam's default feature is `std`, and glam
# needs either `std` or its optional `libm` dependency to compile at all, so
# the default entry would silently defeat the no_std posture the crates
# declare.
glam = { version = "0.30", default-features = false, features = ["libm"] }
bytemuck = { version = "1", features = ["derive"] }
# HLD section 15.2 writes `thiserror = "2"`. The version is untouched and
# only the feature set differs, which is deviation D-15: section 4 puts the
# error model in `ocelli-core`, which carries
# `#![cfg_attr(not(test), no_std)]`, thiserror's default feature is `std`,
# and `cargo tree -e normal,features` then reports `thiserror feature "std"`,
# which is the exact string `scripts/no_std_check.py` searches for. Setting
# `default-features = false` at the MEMBER is ignored by Cargo with a
# warning when the workspace entry does not set it, so the fix has to be
# here. Activated by F-005, and already used by `ocelli-compute`.
thiserror = { version = "2", default-features = false }

# Dev-dependencies, not part of HLD section 15.2's list, which covers what
# ships. `proptest` is the harness section 25's round-trip listing is written
# against. `trybuild` is what asserts that a section 16 space mismatch fails
# to COMPILE, which is the payoff section 16 claims and which no runtime test
# can observe. `pollster` drives the one `async fn` this workspace has,
# `ocelli_render::probe::resolve`, inside a native `#[test]`: wgpu's adapter
# and device requests are futures in the pinned version, and F-004 needs a
# test to be able to await one. All three are dev-only and none reaches the
# shipped surface, so none of them is a section 15.2 deviation.
pollster = "0.4"
proptest = "1"
trybuild = "1"
# F-011. The comparator in `tools/oracle` reads `run.json` and ninety-nine
# sidecars, and re-hashes every `.raw` it reads so a file edited after the run
# cannot be compared as though somebody had rendered it. None of the three is
# in HLD section 15.2's list, and none needs a deviation row: `ocelli-oracle`
# is `publish = false` test infrastructure, so none of them enters the shipped
# surface or the wasm size budget. Same precedent as `proptest` and `trybuild`
# above. `sha2` is not in F-011's plan, which named only `serde` and
# `serde_json`, and it is here because the plan's own input contract requires
# the third hash.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# DICOM-RS FEATURES, HLD section 15.2. Disable default features. The defaults
# are rayon and simd, and the gdcm feature is native-only. On wasm you want
# default-features = false, then jpeg, rle, deflate and openjp2 selected
# explicitly. The inventory-based transfer-syntax plugin registry does not
# work on wasm at all, which is why section 21 specifies an explicit runtime
# registry instead.

# HLD section 15.2, verbatim.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
