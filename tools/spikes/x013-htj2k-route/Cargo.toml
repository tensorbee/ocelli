# THROWAWAY SPIKE CODE. F-X013 prices one candidate and is not a production
# decoder. The empty workspace keeps it outside Ocelli's production graph.
[workspace]

[package]
name = "x013-htj2k-route"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "x013_htj2k_route"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "x013-htj2k-route"
path = "src/main.rs"

[dependencies]
# Exact because every measurement and provenance statement is about 0.1.0.
openjph-core = "=0.1.0"

# HLD section 15.2's shipping profile. Size evidence outside this profile is
# not evidence about the browser artefact.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
