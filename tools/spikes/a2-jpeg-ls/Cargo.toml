# THROWAWAY SPIKE CODE. F-X006, Appendix A gate A2.
#
# `[workspace]` is EMPTY and PRESENT for the same reason as the A1 harness: the
# root manifest declares `members = ["crates/*", "tools/oracle"]`, this directory
# is outside it, and an empty table stops cargo walking up. The root
# `Cargo.toml` is not edited by this story.
[workspace]

[package]
name = "a2-jpeg-ls"
version = "0.0.0"
publish = false
# EDITION 2021 IS A DECISION. Rust 2024 spells an exported symbol
# `#[unsafe(no_mangle)]`, and `scripts/unsafe_allowlist_check.py` matches the
# bare token `unsafe` over every tracked `.rs` file, so a spike file containing
# no unsafe code would fail `gate unsafe` on an attribute.
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "a2_jpeg_ls"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "a2-jpeg-ls"
path = "src/main.rs"

# The three pure-Rust candidates A2 names, all pinned exactly, because A2 is a
# claim about specific versions. Licences were checked against
# `docs/SOURCE-POLICY.md`'s three questions and are recorded in
# `docs/spikes/A2-jpeg-ls.md`. None is copyleft and none is read-blocked.
#
# `charls` 0.4.2 over `charls-sys` 2.4.5 is route R2 and is NOT a dependency
# here. It needs a C++ toolchain and `cmake` to build its vendored CharLS, and
# the answer file records the measurement of that separately rather than making
# this harness unbuildable on a machine without one.
[dependencies]
# R3. MIT OR Apache-2.0. Published as `pure_jpegls`, imported as `jpegls`.
pure_jpegls = { version = "=2.0.0", optional = true }
# R3b. MIT OR Apache-2.0, both.
dicom-toolkit-codec = { version = "=0.5.0", optional = true }
ritk-codecs = { version = "=0.6.0", optional = true }

# ONE FEATURE PER CANDIDATE, so axis 1 ("does it build for
# wasm32-unknown-unknown?") is measurable per candidate rather than as one
# all-or-nothing answer. A candidate whose dependency tree refuses the target
# would otherwise make the whole harness unbuildable and hide the other two.
[features]
default = ["pure-jpegls", "dicom-toolkit", "ritk"]
pure-jpegls = ["dep:pure_jpegls"]
dicom-toolkit = ["dep:dicom-toolkit-codec"]
ritk = ["dep:ritk-codecs"]

# HLD section 15.2, verbatim, so a size measurement is taken under the profile
# that ships.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
