[package]
name = "ocelli-oracle"
description = "Differential harness. Renders the corpus through Ocelli and cornerstone3D and compares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# HLD decision D7 and section 11. This is built BEFORE any port code. It is
# the mechanism that makes generated Rust safe to merge at volume, so it is
# infrastructure and not a phase.
[dependencies]
dicom-core = { workspace = true }
ocelli-codec = { path = "../../crates/ocelli-codec" }
ocelli-cache = { path = "../../crates/ocelli-cache" }
ocelli-core = { path = "../../crates/ocelli-core" }
ocelli-dicom = { path = "../../crates/ocelli-dicom" }
ocelli-pixel = { path = "../../crates/ocelli-pixel" }
ocelli-render = { path = "../../crates/ocelli-render" }
ocelli-viewport = { path = "../../crates/ocelli-viewport" }
ocelli-volume = { path = "../../crates/ocelli-volume" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
pollster = { workspace = true }

# D-27. A shared wgpu line enables the native backends on every target,
# including the wasm32 workspace resolve. The cross-target proof checks this
# crate for wasm32, so that target keeps the browser set and the host keeps
# the desktop backends.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "webgl"] }

[dev-dependencies]
proptest = { workspace = true }

# The comparator, F-011. It reads two directories of reference-half output and
# writes a verdict per view. It is a binary rather than a test because the
# corpus-scale exercises need `tools/oracle/out/`, and an `#[ignore]` test that
# needs a directory reads as a pass on the day it did not run.
[[bin]]
name = "ocelli-compare"
path = "src/bin/ocelli-compare.rs"
