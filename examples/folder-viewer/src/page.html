<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocelli</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #141414;
    color: #e6e6e6;
    overscroll-behavior-x: none;
  }
  body {
    display: grid;
    grid-template-columns: 248px minmax(0, 1fr) 272px;
    grid-template-rows: 44px auto 1fr 40px 28px;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Liberation Sans", Arial, sans-serif;
    overflow: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { color: #5c5c5c; cursor: default; }
  :focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }
  .top {
    grid-column: 1 / -1;
    grid-row: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    background: #1c1c1c;
    border-bottom: 1px solid #2e2e2e;
  }
  .top h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #status {
    margin: 0;
    color: #999999;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #status.fault { color: #f2786d; }
  .segment { display: flex; }
  .segment button, .toolbar button, .inspector button, .sheet button {
    background: transparent;
    border: 1px solid #3d3d3d;
    border-radius: 6px;
    height: 28px;
    padding: 0 8px;
  }
  .segment button + button { border-left: 0; border-radius: 0 6px 6px 0; }
  .segment button:first-child { border-radius: 6px 0 0 6px; }
  .segment button.active, .toolbar button.active, .inspector button.active {
    background: #dedede;
    color: #141414;
    border-color: #dedede;
  }
  .segment button:hover, .toolbar button:hover, .inspector button:hover, #series button:hover {
    background: #262626;
  }
  .segment button.active:hover, .toolbar button.active:hover, .inspector button.active:hover {
    background: #dedede;
    color: #141414;
  }
  nav { display: flex; gap: 14px; }
  nav a { color: #999999; text-decoration: none; }
  nav a[aria-current="page"] { color: #e6e6e6; }
  #series {
    grid-column: 1;
    grid-row: 2 / -1;
    overflow: auto;
    background: #1c1c1c;
    border-right: 1px solid #2e2e2e;
    min-height: 0;
  }
  #series button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #2e2e2e;
    border-left: 2px solid transparent;
    padding: 8px 10px;
  }
  #series button strong { display: block; font-weight: 600; }
  #series button span { display: block; color: #999999; font-size: 12px; }
  #series button.active { background: #262626; border-left-color: #dedede; }
  .toolbar {
    grid-column: 2;
    grid-row: 2;
    height: 40px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 8px;
    background: #1c1c1c;
    border-bottom: 1px solid #2e2e2e;
    overflow: hidden;
  }
  .toolbar .gap { width: 12px; flex: none; }
  .toolbar .spacer { flex: 1; }
  #wrap {
    grid-column: 2;
    grid-row: 3;
    position: relative;
    min-width: 0;
    min-height: 0;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  #frame { position: relative; flex: none; }
  #stage { position: absolute; left: 50%; top: 50%; flex: none; }
  #view, #ink { position: absolute; left: 0; top: 0; }
  #view { image-rendering: pixelated; }
  #ink { overflow: visible; }
  #tiles {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: #2e2e2e;
  }
  #tiles[hidden] { display: none; }
  #tiles canvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000000;
    image-rendering: pixelated;
  }
  .overlay, .edge, #cross-read {
    position: absolute;
    color: #f0f0f0;
    font: 12px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    text-shadow: 0 1px 2px #000000;
    white-space: pre;
    pointer-events: none;
  }
  .tl { top: 8px; left: 10px; }
  .tr { top: 8px; right: 10px; text-align: right; }
  .bl { bottom: 8px; left: 10px; }
  .br { bottom: 8px; right: 10px; text-align: right; }
  .edge.left { left: 8px; top: 50%; transform: translateY(-50%); }
  .edge.right { right: 8px; top: 50%; transform: translateY(-50%); }
  .edge.top { top: 8px; left: 50%; transform: translateX(-50%); }
  .edge.bottom { bottom: 8px; left: 50%; transform: translateX(-50%); }
  #cross-h, #cross-v {
    position: absolute;
    background: #f0f0f0;
    pointer-events: none;
  }
  #cross-h { height: 1px; left: 0; right: 0; }
  #cross-v { width: 1px; top: 0; bottom: 0; }
  #cross-read { transform: translate(8px, 8px); }
  #mag {
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    border: 1px solid #f0f0f0;
    outline: 1px solid #000000;
    pointer-events: none;
    image-rendering: pixelated;
  }
  #fault {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    margin: 0;
    color: #f2786d;
    pointer-events: none;
  }
  .scrubber {
    grid-column: 2;
    grid-row: 4;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    background: #1c1c1c;
    border-top: 1px solid #2e2e2e;
  }
  #scrub { flex: 1; }
  #counter, .scrubber label { color: #999999; }
  #fps { width: 88px; }
  #sentence {
    grid-column: 2;
    grid-row: 5;
    margin: 0;
    padding: 0 10px;
    display: flex;
    align-items: center;
    color: #999999;
    font-size: 12px;
    background: #141414;
    border-top: 1px solid #2e2e2e;
  }
  #inspector {
    grid-column: 3;
    grid-row: 2 / -1;
    overflow: auto;
    background: #1c1c1c;
    border-left: 1px solid #2e2e2e;
    min-height: 0;
    padding: 8px 10px 16px;
  }
  #inspector h2 {
    margin: 12px 0 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #999999;
  }
  #inspector section { border-top: 1px solid #2e2e2e; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .swatch {
    width: 20px;
    height: 20px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid #3d3d3d;
  }
  .swatch.on { outline: 2px solid #ffffff; outline-offset: 1px; }
  #marks button.mark {
    display: flex;
    gap: 8px;
    align-items: center;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #2e2e2e;
    border-radius: 0;
    height: auto;
    padding: 6px 2px;
  }
  #marks button.mark.active { background: #262626; }
  #marks .empty, .mark-note { color: #999999; margin: 6px 0; }
  #marks .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #marks .drop { margin-left: auto; border: 0; background: transparent; color: #999999; height: auto; padding: 0 4px; }
  #note {
    position: fixed;
    z-index: 6;
    background: #1c1c1c;
    color: #e6e6e6;
    border: 1px solid #3d3d3d;
    padding: 4px 6px;
  }
  #modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 7;
  }
  #modal[hidden] { display: none; }
  .sheet {
    width: min(960px, 94vw);
    max-height: 86vh;
    background: #1c1c1c;
    border: 1px solid #2e2e2e;
    display: flex;
    flex-direction: column;
    padding: 12px;
    gap: 8px;
  }
  .sheet header { display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0; color: #e6e6e6; }
  #filter {
    width: 100%;
    background: #141414;
    border: 1px solid #3d3d3d;
    padding: 6px 8px;
  }
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    border-bottom: 1px solid #2e2e2e;
    padding: 4px 8px;
    text-align: left;
    vertical-align: top;
    font: 13px/1.35 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
  }
  td:last-child { white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<header class="top">
  <h1>Ocelli</h1>
  <p id="status">Choose Synthetic study or Folder.</p>
  <div class="segment" id="source">
    <button type="button" id="source-synthetic">Synthetic study</button>
    <button type="button" id="source-folder">Folder</button>
  </div>
  <nav>
    <a href="/" aria-current="page">Images</a>
    <a href="/more">More</a>
    <a href="/use">Use</a>
  </nav>
</header>
<aside id="series"></aside>
<div class="toolbar">
  <button type="button" id="tool-scroll" class="active">Scroll</button>
  <button type="button" id="tool-pan">Pan</button>
  <button type="button" id="tool-zoom">Zoom</button>
  <button type="button" id="tool-wl">W/L</button>
  <span class="gap"></span>
  <button type="button" id="tool-contour">Freeform</button>
  <button type="button" id="tool-rect">Rectangle</button>
  <button type="button" id="tool-ellipse">Ellipse</button>
  <button type="button" id="tool-text">Text</button>
  <button type="button" id="tool-length">Length</button>
  <span class="spacer"></span>
  <button type="button" id="fit">Fit</button>
  <button type="button" id="reset">Reset</button>
  <button type="button" id="fullscreen">Full screen</button>
</div>
<div class="canvas-wrap" id="wrap">
  <div id="frame">
    <div id="stage" hidden>
      <canvas id="view"></canvas>
      <svg id="ink" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div id="tiles" hidden>
    <canvas data-tile="0"></canvas>
    <canvas data-tile="1"></canvas>
    <canvas data-tile="2"></canvas>
    <canvas data-tile="3"></canvas>
  </div>
  <div class="overlay tl" id="ov-tl"></div>
  <div class="overlay tr" id="ov-tr"></div>
  <div class="overlay bl" id="ov-bl"></div>
  <div class="overlay br" id="ov-br"></div>
  <div class="edge left" id="edge-left" hidden></div>
  <div class="edge right" id="edge-right" hidden></div>
  <div class="edge top" id="edge-top" hidden></div>
  <div class="edge bottom" id="edge-bottom" hidden></div>
  <div id="cross-h" hidden></div>
  <div id="cross-v" hidden></div>
  <div id="cross-read" hidden></div>
  <canvas id="mag" width="140" height="140" hidden></canvas>
  <p id="fault" hidden></p>
  <input id="note" hidden placeholder="Note">
</div>
<div class="scrubber">
  <button type="button" id="play">Play</button>
  <label>FPS <input id="fps" type="range" min="1" max="30" value="10"></label>
  <span id="fps-value">10</span>
  <input id="scrub" type="range" min="0" max="0" value="0" disabled>
  <span id="counter">0 / 0</span>
</div>
<p id="sentence"></p>
<aside id="inspector">
  <section>
    <h2>WINDOW</h2>
    <div class="row">
      <button type="button" id="preset-soft" data-preset="soft_tissue">Soft tissue</button>
      <button type="button" id="preset-lung" data-preset="lung">Lung</button>
      <button type="button" id="preset-bone" data-preset="bone">Bone</button>
    </div>
  </section>
  <section>
    <h2>VIEW</h2>
    <div class="row">
      <button type="button" id="invert">Invert</button>
      <button type="button" id="rotate">Rotate 90</button>
      <button type="button" id="flip-h">Flip horizontal</button>
      <button type="button" id="flip-v">Flip vertical</button>
    </div>
  </section>
  <section>
    <h2>DISPLAY</h2>
    <div class="row">
      <button type="button" id="toggle-corners" class="active">Corners</button>
      <button type="button" id="toggle-cross">Pointer cross</button>
      <button type="button" id="toggle-mag">Magnifier</button>
      <button type="button" id="toggle-letters" class="active">Orientation letters</button>
    </div>
  </section>
  <section>
    <h2>LAYOUT</h2>
    <div class="row segment">
      <button type="button" id="grid-1" class="active">1 × 1</button>
      <button type="button" id="grid-2">2 × 2</button>
    </div>
  </section>
  <section>
    <h2>IMAGE</h2>
    <div class="row">
      <button type="button" id="key-image">Key image</button>
      <button type="button" id="headers">Headers</button>
    </div>
  </section>
  <section>
    <h2>MARKS</h2>
    <p class="mark-note">These are drawings in this browser. They are not DICOM SR. They are not written to the file. They are gone when you reload.</p>
    <div class="row" id="swatches"></div>
    <div class="row segment" id="size-row" hidden>
      <button type="button" data-size="12">S</button>
      <button type="button" data-size="15" class="active">M</button>
      <button type="button" data-size="20">L</button>
      <button type="button" data-size="28">XL</button>
    </div>
    <div id="marks"></div>
    <div id="selected-box" hidden>
      <p id="selected-kind"></p>
      <div class="row">
        <button type="button" id="remove">Remove</button>
        <button type="button" id="edit-text" hidden>Edit text</button>
      </div>
    </div>
  </section>
</aside>
<input id="folder" type="file" webkitdirectory directory multiple hidden>
<div id="modal" hidden>
  <div class="sheet" id="sheet">
    <header>
      <h2>Headers</h2>
      <button type="button" id="close-headers">Close</button>
    </header>
    <input id="filter" type="search" placeholder="Filter tag, name, or value">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Tag</th><th>VR</th><th>Name</th><th>Value</th></tr></thead>
        <tbody id="header-rows"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const FRAME_LIST_CAP = 65536;
const FILE_CAP = 1024 * 1024 * 1024;
const GRID_CAP = 32 * 1024 * 1024;
const CACHE_BYTE_BUDGET = 256 * 1024 * 1024;
const INKS = ["#00d1ff", "#3ee06a", "#fff04d", "#ff4fd8", "#ffffff"];
const DRAW = ["contour", "rect", "ellipse", "text", "length"];
const NAV = ["scroll", "pan", "zoom", "wl"];
const TOOLS = NAV.concat(DRAW);
const SENTENCE = {
  scroll: "Drag up or down to move through the images.",
  pan: "Drag to move the image.",
  zoom: "Drag up or down to zoom. A pinch zooms at the pointer.",
  wl: "Drag to change the window. Centre follows up and down. Width follows left and right.",
  contour: "A drawing that follows the pointer. It is kept when it has at least three points. It is not saved.",
  rect: "A drawing around a region. It is not an area and it is not saved.",
  ellipse: "A drawing around a region. It is not an area and it is not saved.",
  text: "A note on this image. Size and colour can be changed. It is not saved.",
  length: "The distance between the two points. It is in millimetres when the file gives Pixel Spacing, and in pixels when it gives no spacing. It is not saved.",
  fit: "Fit the image in the view.",
  reset: "Put the image back to the file window and the fitted view.",
  fullscreen: "The viewport fills the screen. Escape leaves full screen.",
  invert: "Reverse the grey. The pixels in the file are not changed.",
  rotate: "The displayed picture turns. The pixels are not changed and the marks turn with them.",
  "flip-h": "The displayed picture is mirrored. The pixels are not changed and the marks turn with them.",
  "flip-v": "The displayed picture is mirrored. The pixels are not changed and the marks turn with them.",
  "toggle-corners": "Show or hide the labels in the four corners.",
  "toggle-cross": "Two lines meet at the pointer. The numbers are the column and row under it, counted from 1.",
  "toggle-mag": "This circle enlarges the grey pixels already drawn. It copies them and does not blend them.",
  "toggle-letters": "The patient direction at each edge, read from Image Orientation (Patient). The letters are hidden while the picture is turned or flipped.",
  "key-image": "Marks this image in the series list for this session. It is not saved and it does not write a Key Object Selection.",
  headers: "Show the DICOM headers for this image.",
  play: "Play through the images in this series.",
  "preset-soft": "The same LUT chain is run again with this preset's centre and width, in modality units. On a CT that is Hounsfield units.",
  "preset-lung": "The same LUT chain is run again with this preset's centre and width, in modality units. On a CT that is Hounsfield units.",
  "preset-bone": "The same LUT chain is run again with this preset's centre and width, in modality units. On a CT that is Hounsfield units.",
  "grid-1": "One image.",
  "grid-2": "Four neighbouring images from the open series, each one decoded by the same preview.",
  "source-synthetic": "A generated CT. It is not a patient.",
  "source-folder": "Open a folder of DICOM files. The files stay where they are."
};

const folderInput = document.getElementById("folder");
const status = document.getElementById("status");
const seriesEl = document.getElementById("series");
const wrap = document.getElementById("wrap");
const frame = document.getElementById("frame");
const stage = document.getElementById("stage");
const canvas = document.getElementById("view");
const ink = document.getElementById("ink");
const tiles = document.getElementById("tiles");
const fault = document.getElementById("fault");
const scrubber = document.getElementById("scrub");
const counter = document.getElementById("counter");
const playButton = document.getElementById("play");
const fpsInput = document.getElementById("fps");
const fpsValue = document.getElementById("fps-value");
const noteInput = document.getElementById("note");
const modal = document.getElementById("modal");
const filter = document.getElementById("filter");
const headerRowsEl = document.getElementById("header-rows");
const sentence = document.getElementById("sentence");
const marksEl = document.getElementById("marks");
const swatches = document.getElementById("swatches");
const sizeRow = document.getElementById("size-row");
const selectedBox = document.getElementById("selected-box");
const selectedKind = document.getElementById("selected-kind");
const mag = document.getElementById("mag");
const corners = {
  tl: document.getElementById("ov-tl"),
  tr: document.getElementById("ov-tr"),
  bl: document.getElementById("ov-bl"),
  br: document.getElementById("ov-br")
};
const edges = {
  left: document.getElementById("edge-left"),
  right: document.getElementById("edge-right"),
  top: document.getElementById("edge-top"),
  bottom: document.getElementById("edge-bottom")
};

let currentGeneration = 0;
let seriesList = [];
let activeIndex = -1;
let viewIndex = 0;
let sourceMode = "";
const positions = new Map();
const cache = new Map();
const inflight = new Map();
let cacheGeneration = 0;
let cacheBytes = 0;
const notes = new Map();
const keyImages = new Set();
let tool = "scroll";
let fitMode = true;
let scale = 1;
let panX = 0;
let panY = 0;
let rotation = 0;
let flipH = false;
let flipV = false;
let gridMode = 1;
let imageWidth = 0;
let imageHeight = 0;
let overrideWindow = null;
let draftWindow = null;
let activePreset = null;
let invert = false;
let shownWindow = null;
let shownFacts = null;
let showCorners = true;
let showCross = false;
let showMag = false;
let showLetters = true;
let playing = false;
let playToken = 0;
let loadToken = 0;
let tileToken = 0;
let headerRows = [];
let nextNote = 1;
let selected = null;
let drag = null;
let draft = null;
let move = null;
let pendingPoint = null;
let pendingKey = "";
let editingId = null;
let headerToken = 0;
let zoomLabel = "100%";
let currentColor = INKS[0];
let currentSize = 15;
let hoverSentence = "";
let wheelAcc = 0;
let wheelSign = 0;
let wheelIdle = 0;
let wheelFrame = 0;
let pendingDelta = 0;

for (const color of INKS) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "swatch";
  button.style.background = color;
  button.dataset.color = color;
  button.dataset.sentence = "The colour of the next mark. A selected mark takes this colour too.";
  button.addEventListener("click", () => chooseColor(color));
  swatches.append(button);
}

folderInput.addEventListener("change", () => {
  const files = folderInput.files;
  if (!files || !files.length) return;
  sourceMode = "folder";
  markSource();
  readFolder(files);
});
document.getElementById("source-synthetic").addEventListener("click", openSynthetic);
document.getElementById("source-folder").addEventListener("click", () => folderInput.click());
for (const name of TOOLS) {
  document.getElementById("tool-" + name).addEventListener("click", () => setTool(name));
}
document.getElementById("reset").addEventListener("click", resetView);
document.getElementById("fit").addEventListener("click", fitView);
document.getElementById("fullscreen").addEventListener("click", toggleFull);
document.getElementById("invert").addEventListener("click", () => {
  invert = !invert;
  document.getElementById("invert").classList.toggle("active", invert);
  showIndex(viewIndex);
});
document.getElementById("rotate").addEventListener("click", () => {
  rotation = (rotation + 90) % 360;
  layout();
  renderInk();
  paintEdges();
});
document.getElementById("flip-h").addEventListener("click", () => {
  flipH = !flipH;
  document.getElementById("flip-h").classList.toggle("active", flipH);
  layout();
  renderInk();
  paintEdges();
});
document.getElementById("flip-v").addEventListener("click", () => {
  flipV = !flipV;
  document.getElementById("flip-v").classList.toggle("active", flipV);
  layout();
  renderInk();
  paintEdges();
});
document.getElementById("toggle-corners").addEventListener("click", () => {
  showCorners = !showCorners;
  document.getElementById("toggle-corners").classList.toggle("active", showCorners);
  paintOverlays(currentImage());
});
document.getElementById("toggle-cross").addEventListener("click", () => {
  showCross = !showCross;
  document.getElementById("toggle-cross").classList.toggle("active", showCross);
  if (!showCross) hideCross();
});
document.getElementById("toggle-mag").addEventListener("click", () => {
  showMag = !showMag;
  document.getElementById("toggle-mag").classList.toggle("active", showMag);
  if (!showMag) mag.hidden = true;
});
document.getElementById("toggle-letters").addEventListener("click", () => {
  showLetters = !showLetters;
  document.getElementById("toggle-letters").classList.toggle("active", showLetters);
  paintEdges();
});
document.getElementById("grid-1").addEventListener("click", () => setGrid(1));
document.getElementById("grid-2").addEventListener("click", () => setGrid(2));
document.getElementById("key-image").addEventListener("click", toggleKey);
for (const button of document.querySelectorAll("[data-preset]")) {
  button.addEventListener("click", () => applyPreset(button.dataset.preset));
}
for (const button of sizeRow.querySelectorAll("[data-size]")) {
  button.addEventListener("click", () => chooseSize(Number(button.dataset.size)));
}
document.getElementById("remove").addEventListener("click", deleteSelected);
document.getElementById("edit-text").addEventListener("click", () => {
  const note = findNote(selected);
  if (note && note.type === "text") beginEdit(note);
});
document.getElementById("headers").addEventListener("click", openHeaders);
document.getElementById("close-headers").addEventListener("click", closeModal);
document.getElementById("sheet").addEventListener("click", (event) => event.stopPropagation());
modal.addEventListener("click", closeModal);
filter.addEventListener("input", paintHeaderRows);
playButton.addEventListener("click", togglePlay);
fpsInput.addEventListener("input", () => { fpsValue.textContent = fpsInput.value; });
scrubber.addEventListener("input", () => showIndex(Number(scrubber.value)));
wrap.addEventListener("contextmenu", (event) => event.preventDefault());
wrap.addEventListener("wheel", onWheel, { passive: false });
wrap.addEventListener("pointerdown", onPointerDown);
wrap.addEventListener("pointermove", onPointerMove);
wrap.addEventListener("pointerup", onPointerUp);
wrap.addEventListener("pointercancel", onPointerUp);
wrap.addEventListener("pointerleave", () => { hideCross(); mag.hidden = true; });
noteInput.addEventListener("pointerdown", (event) => event.stopPropagation());
noteInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") { event.preventDefault(); event.stopPropagation(); commitNote(); }
  if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); cancelNote(); }
});
noteInput.addEventListener("blur", () => { if (!noteInput.hidden) commitNote(); });
window.addEventListener("keydown", onKey);
window.addEventListener("resize", layout);
new ResizeObserver(layout).observe(wrap);
document.addEventListener("pointerover", (event) => {
  const node = event.target.closest("[data-sentence], [id]");
  if (!node) return;
  const text = node.dataset.sentence || SENTENCE[node.id];
  if (!text) return;
  hoverSentence = liveSentence(node.id, text);
  showSentence();
});
document.addEventListener("pointerout", (event) => {
  const node = event.target.closest("[data-sentence], [id]");
  if (!node) return;
  hoverSentence = "";
  showSentence();
});
if (!document.fullscreenEnabled) {
  const button = document.getElementById("fullscreen");
  button.disabled = true;
  SENTENCE.fullscreen = "Full screen is not available in this browser.";
}
syncSwatches();
syncSizes();
showSentence();

function liveSentence(id, text) {
  if (id === "grid-2" && isDraw(tool)) return "Drawing works in the single view.";
  if (id === "grid-2" && currentImage() && currentImage().file.size > GRID_CAP) {
    return "Four images are not shown for a file larger than 32 MiB.";
  }
  if ((id === "tool-contour" || id === "tool-rect" || id === "tool-ellipse" || id === "tool-text" || id === "tool-length") && gridMode === 2) {
    return "Drawing works in the single view.";
  }
  return text;
}

function showSentence() {
  sentence.textContent = hoverSentence || SENTENCE[toolId(tool)] || "";
}

function toolId(name) {
  return "tool-" + name;
}

function isDraw(name) {
  return DRAW.includes(name);
}

function setTool(next) {
  const leavingGrid = gridMode === 2 && isDraw(next);
  tool = next;
  cancelDraft();
  for (const name of TOOLS) {
    const button = document.getElementById("tool-" + name);
    button.classList.toggle("active", name === next);
    button.disabled = gridMode === 2 && isDraw(name);
  }
  if (isDraw(tool)) setGrid(1, !leavingGrid);
  else document.getElementById("grid-2").disabled = !gridAllowed();
  if (!leavingGrid) renderInk();
  paintMarks();
  showSentence();
}

function markSource() {
  document.getElementById("source-synthetic").classList.toggle("active", sourceMode === "synthetic");
  document.getElementById("source-folder").classList.toggle("active", sourceMode === "folder");
}

async function openSynthetic() {
  const ticket = ++currentGeneration;
  sourceMode = "synthetic";
  markSource();
  status.textContent = "Opening the synthetic study.";
  status.classList.remove("fault");
  let meta;
  try {
    const response = await fetch("/synthetic");
    if (!response.ok) throw new Error("the synthetic study could not be opened");
    meta = await response.json();
  } catch {
    status.textContent = "The synthetic study could not be opened.";
    status.classList.add("fault");
    return;
  }
  const count = Number(meta.slices) || 0;
  const files = [];
  for (let index = 0; index < count; index += 1) {
    let response;
    try {
      response = await fetch("/synthetic/" + index);
    } catch {
      status.textContent = "The synthetic study could not be opened.";
      status.classList.add("fault");
      return;
    }
    if (ticket !== currentGeneration) return;
    if (!response.ok) {
      status.textContent = "The synthetic study could not be opened.";
      status.classList.add("fault");
      return;
    }
    const blob = await response.blob();
    files.push(new File([blob], "synthetic-" + index + ".dcm", { type: "application/dicom" }));
  }
  if (ticket !== currentGeneration) return;
  await readFolder(files);
  if (sourceMode === "synthetic" && seriesList.length) {
    status.textContent = "Synthetic study, not a patient. " + status.textContent;
  }
}

function numeric(text) {
  if (text === "" || text == null) return Number.POSITIVE_INFINITY;
  const value = Number(text);
  return Number.isFinite(value) ? value : Number.POSITIVE_INFINITY;
}

async function readFolder(fileList) {
  const generation = ++currentGeneration;
  stopPlay();
  seriesList = [];
  notes.clear();
  keyImages.clear();
  dropCache();
  positions.clear();
  activeIndex = -1;
  viewIndex = 0;
  selected = null;
  clearView();
  const files = Array.from(fileList);
  let cursor = 0;
  let skipped = 0;
  let failed = 0;
  let oversized = 0;
  const found = [];
  async function worker() {
    while (generation === currentGeneration) {
      const index = cursor;
      cursor += 1;
      if (index >= files.length) return;
      status.textContent = "Reading " + (index + 1) + " of " + files.length;
      status.classList.remove("fault");
      const file = files[index];
      if (file.size > FILE_CAP) {
        oversized += 1;
        continue;
      }
      let response;
      try {
        response = await fetch("/inspect", { method: "POST", body: file });
      } catch {
        failed += 1;
        continue;
      }
      if (generation !== currentGeneration) return;
      if (!response.ok) {
        if (response.headers.get("X-Ocelli-Error") === "not-part10") skipped += 1;
        else if (response.headers.get("X-Ocelli-Error") === "body") oversized += 1;
        else failed += 1;
        continue;
      }
      try {
        found.push({ file, info: await response.json() });
      } catch {
        failed += 1;
      }
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  if (generation !== currentGeneration) return;
  groupSeries(found);
  const skipText = skipped ? " Skipped " + skipped + " files that are not DICOM Part 10." : "";
  const failText = failed ? " " + failed + " files could not be read." : "";
  const largeText = oversized
    ? " " + oversized + (oversized === 1 ? " file is" : " files are") + " larger than this viewer will open."
    : "";
  if (!seriesList.length) {
    status.textContent = "No DICOM series in that folder." + skipText + failText + largeText;
    renderSeries();
    return;
  }
  status.textContent = seriesList.length + (seriesList.length === 1 ? " series." : " series.") + skipText + failText + largeText;
  let best = 0;
  for (let index = 1; index < seriesList.length; index += 1) {
    if (seriesList[index].images.length > seriesList[best].images.length) best = index;
  }
  selectSeries(best);
}

function groupSeries(found) {
  const map = new Map();
  found.forEach((row, order) => {
    const info = row.info || {};
    const key = info.seriesUid ? "uid:" + info.seriesUid : "file:" + order;
    let series = map.get(key);
    if (!series) {
      series = {
        key,
        number: info.seriesNumber || "",
        modality: info.modality || "",
        description: info.seriesDescription || "",
        images: [],
        omitted: 0
      };
      map.set(key, series);
    }
    const reported = Number(info.frames);
    const listed = info.monochrome && Number.isFinite(reported) && reported > 1
      ? Math.floor(reported)
      : 1;
    const steps = Math.min(listed, FRAME_LIST_CAP);
    if (listed > steps) series.omitted += listed - steps;
    for (let frameIndex = 0; frameIndex < steps; frameIndex += 1) {
      series.images.push({
        file: row.file,
        frame: frameIndex,
        info,
        reported: Number.isFinite(reported) && reported > 0 ? Math.floor(reported) : 1
      });
    }
  });
  seriesList = Array.from(map.values());
  seriesList.sort((a, b) => numeric(a.number) - numeric(b.number) || a.description.localeCompare(b.description) || a.key.localeCompare(b.key));
  for (const series of seriesList) {
    series.images.sort((a, b) => numeric(a.info.instanceNumber) - numeric(b.info.instanceNumber) || a.file.name.localeCompare(b.file.name) || a.frame - b.frame);
  }
}

function renderSeries() {
  seriesEl.replaceChildren();
  seriesList.forEach((series, index) => {
    const button = document.createElement("button");
    button.type = "button";
    if (index === activeIndex) button.className = "active";
    const title = document.createElement("strong");
    const bits = [];
    if (series.number !== "") bits.push("#" + series.number);
    if (series.modality !== "") bits.push(series.modality);
    title.textContent = bits.length ? bits.join(" · ") : "Series";
    const description = document.createElement("span");
    description.textContent = series.description || "No description";
    const count = document.createElement("span");
    const images = series.images.length;
    const total = images + (series.omitted || 0);
    count.textContent = series.omitted
      ? images + " of " + total + " images"
      : images + (images === 1 ? " image" : " images");
    button.append(title, description, count);
    const flagged = series.images.filter((image) => keyImages.has(noteKey(image))).length;
    if (flagged) {
      const keys = document.createElement("span");
      keys.textContent = flagged + (flagged === 1 ? " key image" : " key images");
      button.append(keys);
    }
    button.addEventListener("click", () => selectSeries(index));
    seriesEl.append(button);
  });
}

function selectSeries(index) {
  stopPlay();
  activeIndex = index;
  fitMode = true;
  overrideWindow = null;
  draftWindow = null;
  activePreset = null;
  syncPresets();
  const series = seriesList[index];
  const remembered = series ? positions.get(series.key) : 0;
  renderSeries();
  showIndex(Number.isInteger(remembered) ? remembered : 0);
}

function currentImage() {
  const series = seriesList[activeIndex];
  if (!series) return null;
  return series.images[viewIndex] || null;
}

function fileIdentity(file) {
  const path = file.webkitRelativePath || file.name;
  return path + "\0" + file.size + "\0" + file.lastModified;
}

function noteKey(image) {
  if (!image) return "";
  return fileIdentity(image.file) + "\0" + image.frame;
}

function gridAllowed() {
  if (isDraw(tool)) return false;
  const series = seriesList[activeIndex];
  if (!series || !currentImage()) return false;
  const last = Math.min(series.images.length, viewIndex + 4);
  for (let index = viewIndex; index < last; index += 1) {
    if (series.images[index].file.size > GRID_CAP) return false;
  }
  return true;
}

function setGrid(mode, silent) {
  if (mode === 2 && !gridAllowed()) mode = 1;
  gridMode = mode;
  document.getElementById("grid-1").classList.toggle("active", mode === 1);
  const many = document.getElementById("grid-2");
  many.classList.toggle("active", mode === 2);
  many.disabled = !gridAllowed();
  for (const name of DRAW) {
    document.getElementById("tool-" + name).disabled = mode === 2;
  }
  tiles.hidden = mode !== 2;
  if (!silent && currentImage()) showIndex(viewIndex);
  else syncStage();
}

async function showIndex(next) {
  const series = seriesList[activeIndex];
  if (!series || !series.images.length) return;
  const count = series.images.length;
  viewIndex = ((next % count) + count) % count;
  positions.set(series.key, viewIndex);
  const image = series.images[viewIndex];
  scrubber.disabled = count <= 1;
  scrubber.max = String(Math.max(0, count - 1));
  scrubber.value = String(viewIndex);
  const total = count + (series.omitted || 0);
  counter.textContent = series.omitted
    ? (viewIndex + 1) + " / " + count + " of " + total
    : (viewIndex + 1) + " / " + count;
  selected = null;
  cancelDraft();
  paintMarks();
  document.getElementById("grid-2").disabled = !gridAllowed();
  if (gridMode === 2 && !gridAllowed()) {
    gridMode = 1;
    document.getElementById("grid-1").classList.add("active");
    document.getElementById("grid-2").classList.remove("active");
    tiles.hidden = true;
  }
  const token = ++loadToken;
  if (!image.info.monochrome) {
    shownWindow = null;
    shownFacts = null;
    stage.hidden = true;
    tiles.hidden = true;
    ink.replaceChildren();
    paintOverlays(image);
    showFault("this preview shows monochrome frames only");
    return;
  }
  if (gridMode === 2) paintTiles();
  const hit = takeGrey(cacheKey(image));
  if (hit) {
    applyGrey(hit, image);
    return;
  }
  shownWindow = null;
  shownFacts = null;
  imageWidth = 0;
  imageHeight = 0;
  stage.hidden = true;
  frame.hidden = true;
  ink.replaceChildren();
  paintOverlays(image);
  paintEdges();
  try {
    const grey = await fetchGrey(image);
    if (token !== loadToken) return;
    applyGrey(grey, image);
  } catch (error) {
    if (token !== loadToken) return;
    shownWindow = null;
    shownFacts = null;
    paintOverlays(image);
    showFault(error instanceof Error ? error.message : "the frame could not be shown");
  }
}

function applyGrey(grey, image) {
  hideFault();
  shownWindow = {
    center: grey.center,
    width: grey.widthText,
    fn: grey.fn || "LINEAR",
    fullRange: grey.fullRange
  };
  shownFacts = grey.facts;
  drawGrey(grey);
  paintOverlays(image);
  paintEdges();
  prefetch(viewIndex + 1);
  syncKey();
}

function cacheKey(image) {
  const win = overrideWindow
    ? overrideWindow.center + "/" + overrideWindow.width + "/" + overrideWindow.fn
    : (activePreset || "file");
  return fileIdentity(image.file) + "\0" + image.frame + "\0" + win + "\0" + (invert ? "1" : "0");
}

function dropCache() {
  cacheGeneration += 1;
  cache.clear();
  inflight.clear();
  cacheBytes = 0;
}

function greyBytes(grey) {
  return grey && grey.bytes ? grey.bytes.byteLength : 0;
}

function takeGrey(key) {
  const hit = cache.get(key);
  if (!hit) return null;
  cache.delete(key);
  cache.set(key, hit);
  return hit;
}

function rememberGrey(key, grey) {
  if (cache.has(key)) {
    cacheBytes -= greyBytes(cache.get(key));
    cache.delete(key);
  }
  cache.set(key, grey);
  cacheBytes += greyBytes(grey);
  while (cache.size > 1 && cacheBytes > CACHE_BYTE_BUDGET) {
    const oldest = cache.keys().next().value;
    if (oldest === undefined) break;
    cacheBytes -= greyBytes(cache.get(oldest));
    cache.delete(oldest);
  }
}

async function fetchGrey(image) {
  const key = cacheKey(image);
  const hit = takeGrey(key);
  if (hit) return hit;
  const pending = inflight.get(key);
  if (pending) return pending;
  const generation = cacheGeneration;
  const job = requestGrey(image).then((grey) => {
    if (generation === cacheGeneration) rememberGrey(key, grey);
    return grey;
  }).finally(() => {
    if (inflight.get(key) === job) inflight.delete(key);
  });
  inflight.set(key, job);
  return job;
}

async function requestGrey(image) {
  const headers = { "X-Ocelli-Frame": String(image.frame) };
  if (invert) headers["X-Ocelli-Invert"] = "1";
  if (overrideWindow) {
    headers["X-Ocelli-Window-Center"] = String(overrideWindow.center);
    headers["X-Ocelli-Window-Width"] = String(overrideWindow.width);
    headers["X-Ocelli-Window-Function"] = overrideWindow.fn;
  } else if (activePreset) {
    headers["X-Ocelli-Window-Preset"] = activePreset;
  }
  const response = await fetch("/preview", { method: "POST", headers, body: image.file });
  if (!response.ok) {
    const message = await response.text();
    throw new Error(message || "the frame could not be shown");
  }
  const width = Number(response.headers.get("X-Ocelli-Width"));
  const height = Number(response.headers.get("X-Ocelli-Height"));
  const bytes = new Uint8Array(await response.arrayBuffer());
  if (!width || !height || bytes.length !== width * height) {
    throw new Error("the preview response did not match the frame");
  }
  return {
    width,
    height,
    fullRange: response.headers.get("X-Ocelli-Full-Range") === "1",
    center: response.headers.get("X-Ocelli-Window-Center") || "",
    widthText: response.headers.get("X-Ocelli-Window-Width") || "",
    fn: response.headers.get("X-Ocelli-Window-Function") || "",
    bytes,
    facts: {
      row: headerNumber(response, "X-Ocelli-Row-Spacing"),
      column: headerNumber(response, "X-Ocelli-Column-Spacing"),
      source: response.headers.get("X-Ocelli-Spacing-Source") || "",
      left: response.headers.get("X-Ocelli-Edge-Left") || "",
      right: response.headers.get("X-Ocelli-Edge-Right") || "",
      top: response.headers.get("X-Ocelli-Edge-Top") || "",
      bottom: response.headers.get("X-Ocelli-Edge-Bottom") || ""
    }
  };
}

function headerNumber(response, name) {
  const text = response.headers.get(name);
  if (text == null || text === "") return null;
  const value = Number(text);
  return Number.isFinite(value) ? value : null;
}

function prefetch(index) {
  const series = seriesList[activeIndex];
  if (!series || !series.images.length) return;
  const image = series.images[((index % series.images.length) + series.images.length) % series.images.length];
  if (!image || !image.info.monochrome) return;
  fetchGrey(image).catch(() => {});
}

function drawGrey(grey) {
  imageWidth = grey.width;
  imageHeight = grey.height;
  canvas.width = grey.width;
  canvas.height = grey.height;
  const context = canvas.getContext("2d");
  if (!context) {
    showFault("this browser did not provide a canvas");
    return;
  }
  const image = context.createImageData(grey.width, grey.height);
  for (let index = 0; index < grey.bytes.length; index += 1) {
    const offset = index * 4;
    const value = grey.bytes[index];
    image.data[offset] = value;
    image.data[offset + 1] = value;
    image.data[offset + 2] = value;
    image.data[offset + 3] = 255;
  }
  context.putImageData(image, 0, 0);
  ink.setAttribute("viewBox", "0 0 " + grey.width + " " + grey.height);
  syncStage();
  if (gridMode === 1) {
    layout();
    renderInk();
  }
}

function syncStage() {
  const single = gridMode === 1 && imageWidth > 0 && !fault.textContent;
  stage.hidden = !single;
  tiles.hidden = gridMode !== 2;
  frame.hidden = !single;
}

async function paintTiles() {
  const token = ++tileToken;
  const series = seriesList[activeIndex];
  const nodes = tiles.querySelectorAll("canvas");
  for (let index = 0; index < nodes.length; index += 1) {
    const node = nodes[index];
    const image = series && series.images[viewIndex + index];
    if (!image || !image.info.monochrome) {
      node.width = 1;
      node.height = 1;
      continue;
    }
    try {
      const grey = await fetchGrey(image);
      if (token !== tileToken || gridMode !== 2) return;
      const context = node.getContext("2d");
      if (!context) continue;
      node.width = grey.width;
      node.height = grey.height;
      const pixels = context.createImageData(grey.width, grey.height);
      for (let offset = 0; offset < grey.bytes.length; offset += 1) {
        const byte = offset * 4;
        const value = grey.bytes[offset];
        pixels.data[byte] = value;
        pixels.data[byte + 1] = value;
        pixels.data[byte + 2] = value;
        pixels.data[byte + 3] = 255;
      }
      context.putImageData(pixels, 0, 0);
    } catch {
      if (token !== tileToken) return;
      node.width = 1;
      node.height = 1;
    }
  }
}

function fitScale() {
  const rect = wrap.getBoundingClientRect();
  if (!imageWidth || !imageHeight || rect.width < 1 || rect.height < 1) return 1;
  const turned = rotation % 180 !== 0;
  const width = turned ? imageHeight : imageWidth;
  const height = turned ? imageWidth : imageHeight;
  return Math.min(rect.width / width, rect.height / height);
}

function layout() {
  if (!imageWidth || stage.hidden) return;
  if (fitMode) {
    scale = fitScale();
    panX = 0;
    panY = 0;
  }
  const pictureW = Math.max(1, imageWidth * scale);
  const pictureH = Math.max(1, imageHeight * scale);
  const turned = rotation % 180 !== 0;
  frame.style.width = (turned ? pictureH : pictureW) + "px";
  frame.style.height = (turned ? pictureW : pictureH) + "px";
  frame.style.transform = "translate(" + panX + "px, " + panY + "px)";
  stage.style.width = pictureW + "px";
  stage.style.height = pictureH + "px";
  stage.style.marginLeft = (-pictureW / 2) + "px";
  stage.style.marginTop = (-pictureH / 2) + "px";
  const fx = flipH ? -1 : 1;
  const fy = flipV ? -1 : 1;
  stage.style.transform = "rotate(" + rotation + "deg) scale(" + fx + ", " + fy + ")";
  stage.style.transformOrigin = "center center";
  canvas.style.width = pictureW + "px";
  canvas.style.height = pictureH + "px";
  ink.style.width = pictureW + "px";
  ink.style.height = pictureH + "px";
  const fitted = fitScale();
  zoomLabel = (fitted > 0 ? Math.round((scale / fitted) * 100) : 100) + "%";
  paintOverlays(currentImage());
  syncTextScale();
  paintSelection();
}

function turnedOrFlipped() {
  return rotation !== 0 || flipH || flipV;
}

function paintOverlays(image) {
  const hidden = !showCorners;
  for (const node of Object.values(corners)) node.hidden = hidden;
  if (!image || hidden) {
    corners.tl.textContent = "";
    corners.tr.textContent = "";
    corners.bl.textContent = "";
    corners.br.textContent = "";
    return;
  }
  const info = image.info || {};
  const series = seriesList[activeIndex];
  const count = series ? series.images.length : 0;
  corners.tl.textContent = [info.patientName, info.patientId, info.studyDate].filter(Boolean).join("\n");
  const head = [info.modality, info.seriesDescription].filter(Boolean).join(" ");
  corners.tr.textContent = [head, info.accession].filter(Boolean).join("\n");
  const lower = ["Image " + (viewIndex + 1) + " / " + count];
  if (series && series.omitted) lower.push("Series shortened");
  if (info.instanceNumber) lower.push("Instance " + info.instanceNumber);
  if (image.reported > 1) lower.push("Frame " + (image.frame + 1) + " / " + image.reported);
  corners.bl.textContent = lower.join("\n");
  const win = draftWindow || overrideWindow || shownWindow;
  const center = win ? win.center : (info.windowCenter || "");
  const width = win ? (win.width == null ? win.widthText : win.width) : (info.windowWidth || "");
  let windowLine = "WW " + width + "  WL " + center;
  if (shownWindow && shownWindow.fullRange && !overrideWindow && !draftWindow && !activePreset) windowLine += "  full range";
  corners.br.textContent = windowLine + "\nZoom " + zoomLabel;
}

function paintEdges() {
  const facts = shownFacts;
  const hide = !showLetters || !facts || gridMode !== 1 || turnedOrFlipped();
  const values = facts ? [facts.left, facts.right, facts.top, facts.bottom] : ["", "", "", ""];
  ["left", "right", "top", "bottom"].forEach((side, index) => {
    edges[side].hidden = hide || !values[index];
    edges[side].textContent = hide ? "" : values[index];
  });
}

function showFault(message) {
  fault.hidden = false;
  fault.textContent = message;
  stage.hidden = true;
  frame.hidden = true;
  tileToken += 1;
  tiles.hidden = true;
  for (const node of tiles.querySelectorAll("canvas")) {
    node.width = 1;
    node.height = 1;
  }
}

function hideFault() {
  fault.hidden = true;
  fault.textContent = "";
}

function clearView() {
  loadToken += 1;
  tileToken += 1;
  shownWindow = null;
  shownFacts = null;
  cancelDraft();
  cancelNote();
  imageWidth = 0;
  imageHeight = 0;
  stage.hidden = true;
  frame.hidden = true;
  tiles.hidden = true;
  hideFault();
  ink.replaceChildren();
  counter.textContent = "0 / 0";
  scrubber.value = "0";
  scrubber.disabled = true;
  renderSeries();
  paintOverlays(null);
  paintEdges();
  paintMarks();
}

function fitView() {
  fitMode = true;
  layout();
}

function resetView() {
  overrideWindow = null;
  draftWindow = null;
  activePreset = null;
  syncPresets();
  invert = false;
  document.getElementById("invert").classList.remove("active");
  rotation = 0;
  flipH = false;
  flipV = false;
  document.getElementById("flip-h").classList.remove("active");
  document.getElementById("flip-v").classList.remove("active");
  fitMode = true;
  panX = 0;
  panY = 0;
  showIndex(viewIndex);
}

function applyPreset(name) {
  activePreset = name;
  overrideWindow = null;
  draftWindow = null;
  syncPresets();
  showIndex(viewIndex);
}

function syncPresets() {
  for (const button of document.querySelectorAll("[data-preset]")) {
    button.classList.toggle("active", button.dataset.preset === activePreset && !overrideWindow);
  }
}

function clamp(value, low, high) {
  return Math.min(high, Math.max(low, value));
}

function pixelDelta(event) {
  let dy = event.deltaY;
  if (event.deltaMode === 1) dy *= 16;
  else if (event.deltaMode === 2) dy *= wrap.clientHeight || 1;
  return dy;
}

function onWheel(event) {
  if (Math.abs(event.deltaX) > Math.abs(event.deltaY)) {
    event.preventDefault();
    return;
  }
  if (event.ctrlKey) {
    event.preventDefault();
    if (!currentImage() || stage.hidden || gridMode !== 1) return;
    if (!noteInput.hidden || !modal.hidden || move) return;
    const dy = clamp(pixelDelta(event), -10, 10);
    zoomAt(event.clientX, event.clientY, Math.exp(-dy * 0.01));
    return;
  }
  if (!noteInput.hidden || !modal.hidden) return;
  if (!currentImage()) return;
  if (draft || move) return;
  event.preventDefault();
  const dy = pixelDelta(event);
  if (!dy) return;
  if (playing) {
    stopPlay();
    wheelAcc = 0;
    queueSlice(dy > 0 ? 1 : -1);
    return;
  }
  const sign = dy > 0 ? 1 : -1;
  const now = performance.now();
  if (sign !== wheelSign || now - wheelIdle > 150) wheelAcc = 0;
  wheelSign = sign;
  wheelIdle = now;
  wheelAcc += dy;
  if (Math.abs(wheelAcc) >= 40) {
    wheelAcc = 0;
    queueSlice(sign);
  }
}

function queueSlice(delta) {
  pendingDelta += delta;
  if (wheelFrame) return;
  wheelFrame = requestAnimationFrame(() => {
    wheelFrame = 0;
    const step = pendingDelta;
    pendingDelta = 0;
    if (step) showIndex(viewIndex + step);
  });
}

function zoomAt(clientX, clientY, factor) {
  if (!imageWidth || !scale || stage.hidden) return;
  const fitted = fitScale();
  const next = clamp(scale * factor, fitted * 0.05, fitted * 40);
  if (next === scale) return;
  const rect = wrap.getBoundingClientRect();
  const qx = clientX - (rect.left + rect.width / 2) - panX;
  const qy = clientY - (rect.top + rect.height / 2) - panY;
  const ratio = next / scale;
  panX += qx * (1 - ratio);
  panY += qy * (1 - ratio);
  scale = next;
  fitMode = false;
  layout();
}

function pointerMode(event) {
  if (event.button === 2 || (event.button === 0 && event.ctrlKey)) return "pan";
  if (event.button === 1) return "zoom";
  return tool;
}

function onPointerDown(event) {
  if (!currentImage() || gridMode !== 1) {
    if (gridMode === 2) pointReadout(event);
    return;
  }
  if (event.button === 1) event.preventDefault();
  const mode = pointerMode(event);
  const onMark = event.button === 0 && !event.ctrlKey && event.target.closest("[data-id]");
  if (onMark && isDraw(tool)) return;
  if (mode === "wl" && !shownWindow && !overrideWindow && currentWindowText("windowCenter") === "") return;
  drag = {
    id: event.pointerId,
    button: event.button,
    mode,
    x: event.clientX,
    y: event.clientY,
    originX: event.clientX,
    originY: event.clientY,
    moved: 0,
    markId: onMark ? onMark.dataset.id : "",
    originCenter: Number(dragWindow().center),
    originWidth: Number(dragWindow().width) || 1,
    originFn: knownFunction(dragWindow().fn)
  };
  wrap.setPointerCapture(event.pointerId);
  if (!onMark && event.button === 0 && !event.ctrlKey && (mode === "contour" || mode === "rect" || mode === "ellipse" || mode === "length")) {
    stopPlay();
    const point = mode === "contour" ? imagePoint(event) : clampedImagePoint(event);
    if (point) draft = { kind: mode, points: [point], key: noteKey(currentImage()) };
  }
  if (!onMark && mode === "text" && event.button === 0) drag.textClick = true;
  if (!onMark && NAV.includes(mode) && event.button === 0 && !event.ctrlKey) {
    selected = null;
    paintMarks();
    renderInk();
  }
}

function onPointerMove(event) {
  pointReadout(event);
  if (move && move.pointer === event.pointerId) {
    const travel = Math.hypot(event.clientX - move.x, event.clientY - move.y);
    if (travel < 5) return;
    moveNote(event);
    return;
  }
  if (!drag || drag.id !== event.pointerId) return;
  const travel = Math.hypot(event.clientX - drag.originX, event.clientY - drag.originY);
  if (drag.markId && travel < 5) return;
  if (drag.markId && travel >= 5) drag.markId = "";
  const mode = drag.mode;
  if (mode === "pan") {
    fitMode = false;
    panX += event.clientX - drag.x;
    panY += event.clientY - drag.y;
    drag.x = event.clientX;
    drag.y = event.clientY;
    layout();
  } else if (mode === "zoom") {
    const factor = Math.exp(-(event.clientY - drag.y) * 0.01);
    drag.y = event.clientY;
    zoomAt(drag.originX, drag.originY, factor);
  } else if (mode === "scroll") {
    drag.moved += event.clientY - drag.y;
    drag.y = event.clientY;
    while (drag.moved >= 24) { drag.moved -= 24; showIndex(viewIndex + 1); }
    while (drag.moved <= -24) { drag.moved += 24; showIndex(viewIndex - 1); }
  } else if (mode === "wl") {
    const speed = Math.max(0.5, Math.abs(drag.originWidth) / 200);
    const minWidth = drag.originFn === "LINEAR" ? 1 : 0.01;
    draftWindow = {
      center: drag.originCenter + (drag.originY - event.clientY) * speed,
      width: Math.max(minWidth, drag.originWidth + (event.clientX - drag.originX) * speed),
      fn: drag.originFn
    };
    paintOverlays(currentImage());
  } else if (draft && (mode === "contour" || mode === "rect" || mode === "ellipse" || mode === "length")) {
    const point = mode === "contour" ? imagePoint(event) : clampedImagePoint(event);
    if (!point) return;
    if (mode === "contour") {
      const last = draft.points[draft.points.length - 1];
      if (!last) return;
      const dx = point.x - last.x;
      const dy = point.y - last.y;
      if (dx * dx + dy * dy >= 2) {
        draft.points.push(point);
        paintDraft();
      }
    } else {
      draft.points[1] = point;
      paintDraft();
    }
  }
}

function onPointerUp(event) {
  if (move && move.pointer === event.pointerId) {
    const origin = move.origin;
    const note = findNote(move.id);
    move = null;
    if (pointsMoved(note, origin)) renderInk();
    else paintSelection();
  }
  if (!drag || drag.id !== event.pointerId) return;
  const mode = drag.mode;
  const travel = Math.hypot(event.clientX - drag.originX, event.clientY - drag.originY);
  if (drag.markId && travel < 5) {
    selected = Number(drag.markId);
    paintMarks();
    paintSelection();
  }
  if (mode === "wl" && draftWindow) {
    overrideWindow = {
      center: draftWindow.center,
      width: draftWindow.width,
      fn: draftWindow.fn
    };
    draftWindow = null;
    activePreset = null;
    syncPresets();
    showIndex(viewIndex);
  }
  if (draft && (mode === "contour" || mode === "rect" || mode === "ellipse" || mode === "length")) {
    finishDraft(travel);
  }
  if (drag.textClick && travel < 5) {
    const point = imagePoint(event);
    if (point) openNote(point, event.clientX, event.clientY);
  }
  drag = null;
}

function finishDraft(travel) {
  const kind = draft.kind;
  const key = draft.key;
  const points = draft.points.slice();
  draft = null;
  clearDraftNodes();
  if (kind === "contour") {
    if (points.length >= 3) addNote({ type: "contour", points, color: currentColor }, key);
    return;
  }
  if (points.length < 2 || travel < 5) return;
  if (kind === "length") {
    const dx = points[1].x - points[0].x;
    const dy = points[1].y - points[0].y;
    if (dx * dx + dy * dy < 1) return;
    addNote({ type: "length", points: [points[0], points[1]], color: currentColor }, key);
    return;
  }
  const box = normalBox(points[0], points[1]);
  if (box.width < 1 || box.height < 1) return;
  const stored = [{ x: box.x, y: box.y }, { x: box.x + box.width, y: box.y + box.height }];
  addNote({ type: kind, points: stored, color: currentColor }, key);
}

function imagePoint(event) {
  const point = clientToImage(event.clientX, event.clientY);
  if (!point) return null;
  if (point.x < 0 || point.y < 0 || point.x > imageWidth || point.y > imageHeight) return null;
  return point;
}

function clampedImagePoint(event) {
  const point = clientToImage(event.clientX, event.clientY);
  if (!point || !imageWidth || !imageHeight) return null;
  return {
    x: clamp(point.x, 0, imageWidth),
    y: clamp(point.y, 0, imageHeight)
  };
}

function clientToImage(clientX, clientY) {
  if (!imageWidth || !imageHeight || !scale) return null;
  const rect = wrap.getBoundingClientRect();
  let x = clientX - (rect.left + rect.width / 2 + panX);
  let y = clientY - (rect.top + rect.height / 2 + panY);
  const rad = -rotation * Math.PI / 180;
  const cos = Math.cos(rad);
  const sin = Math.sin(rad);
  const rx = x * cos - y * sin;
  const ry = x * sin + y * cos;
  const fx = flipH ? -1 : 1;
  const fy = flipV ? -1 : 1;
  return {
    x: imageWidth / 2 + (rx / fx) / scale,
    y: imageHeight / 2 + (ry / fy) / scale
  };
}

function pointReadout(event) {
  const tile = gridMode === 2 ? event.target.closest("#tiles canvas") : null;
  const point = tile ? tilePoint(tile, event) : imagePoint(event);
  if (showCross && point && gridMode === 1) {
    const local = wrap.getBoundingClientRect();
    document.getElementById("cross-h").hidden = false;
    document.getElementById("cross-v").hidden = false;
    document.getElementById("cross-read").hidden = false;
    document.getElementById("cross-h").style.top = (event.clientY - local.top) + "px";
    document.getElementById("cross-v").style.left = (event.clientX - local.left) + "px";
    const column = Math.min(imageWidth, Math.max(1, Math.floor(point.x) + 1));
    const row = Math.min(imageHeight, Math.max(1, Math.floor(point.y) + 1));
    const read = document.getElementById("cross-read");
    read.style.left = (event.clientX - local.left) + "px";
    read.style.top = (event.clientY - local.top) + "px";
    read.textContent = "C " + column + "  R " + row;
  } else hideCross();
  if (showMag && point) updateMag(event, tile, point);
  else mag.hidden = true;
}

function tilePoint(node, event) {
  const rect = node.getBoundingClientRect();
  if (!node.width || !node.height || !rect.width || !rect.height) return null;
  const fitted = Math.min(rect.width / node.width, rect.height / node.height);
  const dw = node.width * fitted;
  const dh = node.height * fitted;
  const left = rect.left + (rect.width - dw) / 2;
  const top = rect.top + (rect.height - dh) / 2;
  const x = (event.clientX - left) / fitted;
  const y = (event.clientY - top) / fitted;
  if (x < 0 || y < 0 || x > node.width || y > node.height) return null;
  return { x, y, width: node.width, height: node.height };
}

function hideCross() {
  document.getElementById("cross-h").hidden = true;
  document.getElementById("cross-v").hidden = true;
  document.getElementById("cross-read").hidden = true;
}

function updateMag(event, tile, point) {
  const source = tile || canvas;
  const context = mag.getContext("2d");
  if (!context) return;
  const width = point.width || imageWidth;
  const height = point.height || imageHeight;
  context.imageSmoothingEnabled = false;
  context.clearRect(0, 0, 140, 140);
  const src = 140 / 4;
  context.drawImage(source, point.x - src / 2, point.y - src / 2, src, src, 0, 0, 140, 140);
  const local = wrap.getBoundingClientRect();
  mag.style.left = (event.clientX - local.left + 16) + "px";
  mag.style.top = (event.clientY - local.top - 156) + "px";
  mag.hidden = false;
  if (point.x < 0 || point.y < 0 || point.x > width || point.y > height) mag.hidden = true;
}

function draftShape() {
  if (!draft) return "";
  if (draft.kind === "contour") return "polyline";
  if (draft.kind === "length") return "line";
  return draft.kind;
}

function ensureDraftNode(id, kind) {
  let node = document.getElementById(id);
  if (!node || node.tagName.toLowerCase() !== kind) {
    if (node) node.remove();
    node = document.createElementNS(SVGNS, kind);
    node.id = id;
    ink.append(node);
  }
  return node;
}

function paintDraftGeometry(node, kind) {
  const end = draft.points[1] || draft.points[0];
  if (kind === "polyline") node.setAttribute("points", pointsAttr(draft.points));
  else if (kind === "line") setLine(node, draft.points[0], end);
  else setBox(node, draft.points[0], end);
}

function paintDraft() {
  if (!draft) return;
  const kind = draftShape();
  const under = ensureDraftNode("draft-under", kind);
  const node = ensureDraftNode("draft", kind);
  stroke(under, "#000000", 4);
  under.setAttribute("opacity", "0.8");
  under.setAttribute("pointer-events", "none");
  stroke(node, currentColor, 2);
  node.setAttribute("pointer-events", "none");
  paintDraftGeometry(under, kind);
  paintDraftGeometry(node, kind);
}

function clearDraftNodes() {
  const under = document.getElementById("draft-under");
  const line = document.getElementById("draft");
  if (under) under.remove();
  if (line) line.remove();
}

function cancelDraft() {
  draft = null;
  clearDraftNodes();
}

function pointsAttr(points) {
  return points.map((point) => point.x + "," + point.y).join(" ");
}

function normalBox(a, b) {
  const x = Math.min(a.x, b.x);
  const y = Math.min(a.y, b.y);
  return { x, y, width: Math.abs(b.x - a.x), height: Math.abs(b.y - a.y) };
}

function setBox(node, a, b) {
  const box = normalBox(a, b);
  if (node.tagName.toLowerCase() === "ellipse") {
    node.setAttribute("cx", String(box.x + box.width / 2));
    node.setAttribute("cy", String(box.y + box.height / 2));
    node.setAttribute("rx", String(box.width / 2));
    node.setAttribute("ry", String(box.height / 2));
    return;
  }
  node.setAttribute("x", String(box.x));
  node.setAttribute("y", String(box.y));
  node.setAttribute("width", String(box.width));
  node.setAttribute("height", String(box.height));
}

function setLine(node, a, b) {
  node.setAttribute("x1", String(a.x));
  node.setAttribute("y1", String(a.y));
  node.setAttribute("x2", String(b.x));
  node.setAttribute("y2", String(b.y));
}

function stroke(node, color, width) {
  node.setAttribute("fill", "none");
  node.setAttribute("stroke", color);
  node.setAttribute("stroke-width", String(width));
  node.setAttribute("vector-effect", "non-scaling-stroke");
}

function addNote(note, key) {
  if (!key) return;
  const list = notes.get(key) || [];
  note.id = nextNote;
  nextNote += 1;
  if (note.type === "text") note.size = currentSize;
  list.push(note);
  notes.set(key, list);
  if (key !== noteKey(currentImage())) return;
  selected = note.id;
  renderInk();
  paintMarks();
}

function renderInk() {
  ink.replaceChildren();
  if (gridMode !== 1) return;
  const list = notes.get(noteKey(currentImage())) || [];
  for (const note of list) appendNote(note);
  if (draft && draft.key === noteKey(currentImage())) paintDraft();
  paintSelection();
}

function appendNote(note) {
  if (note.type === "text") {
    const text = document.createElementNS(SVGNS, "text");
    text.dataset.id = String(note.id);
    text.dataset.size = String(note.size || 15);
    text.classList.add("label");
    text.textContent = note.text || "";
    placeText(text, note);
    text.addEventListener("dblclick", (event) => {
      event.stopPropagation();
      selected = note.id;
      beginEdit(note);
    });
    bindShape(text, note);
    ink.append(text);
    return;
  }
  const group = document.createElementNS(SVGNS, "g");
  group.dataset.id = String(note.id);
  const shape = note.type === "contour" ? "polygon" : (note.type === "length" ? "line" : note.type);
  const under = document.createElementNS(SVGNS, shape);
  const inked = document.createElementNS(SVGNS, shape);
  const hit = document.createElementNS(SVGNS, shape);
  paintShape(under, note);
  paintShape(inked, note);
  paintShape(hit, note);
  stroke(under, "#000000", 4);
  under.setAttribute("opacity", "0.8");
  under.setAttribute("pointer-events", "none");
  stroke(inked, note.color || currentColor, 2);
  inked.setAttribute("pointer-events", "none");
  stroke(hit, "transparent", 12);
  hit.setAttribute("pointer-events", "stroke");
  group.append(under, inked, hit);
  if (note.type === "length") {
    const label = document.createElementNS(SVGNS, "text");
    label.classList.add("label");
    label.dataset.size = "15";
    placeLabel(label, note);
    group.append(label);
  }
  bindShape(group, note);
  ink.append(group);
}

function paintShape(node, note) {
  if (note.type === "contour") node.setAttribute("points", pointsAttr(note.points));
  else if (note.type === "length") setLine(node, note.points[0], note.points[1]);
  else setBox(node, note.points[0], note.points[1]);
}

function uprightTransform(x, y) {
  const fx = flipH ? -1 : 1;
  const fy = flipV ? -1 : 1;
  return "translate(" + x + " " + y + ") scale(" + fx + " " + fy + ") rotate(" + (-rotation) + ") translate(" + (-x) + " " + (-y) + ")";
}

function placeText(node, note) {
  const point = note.points[0] || { x: 0, y: 0 };
  const size = note.size || 15;
  node.setAttribute("x", String(point.x));
  node.setAttribute("y", String(point.y));
  node.setAttribute("fill", note.color || currentColor);
  node.setAttribute("stroke", "#000000");
  node.setAttribute("font-size", String(size / scale));
  node.setAttribute("stroke-width", String(size * 0.18 / scale));
  node.setAttribute("paint-order", "stroke");
  node.setAttribute("pointer-events", "visiblePainted");
  node.setAttribute("transform", uprightTransform(point.x, point.y));
}

function placeLabel(node, note) {
  const a = note.points[0];
  const b = note.points[1];
  node.textContent = lengthText(note);
  placeText(node, { points: [{ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }], color: note.color, size: 15 });
}

function lengthText(note) {
  const a = note.points[0];
  const b = note.points[1];
  const dCol = b.x - a.x;
  const dRow = b.y - a.y;
  const facts = shownFacts;
  if (facts && facts.source && facts.row != null && facts.column != null) {
    const mm = Math.hypot(dCol * facts.column, dRow * facts.row);
    const text = String(Math.round(mm * 10) / 10);
    if (facts.source === "ImagerPixelSpacing") return text + " mm at the detector";
    return text + " mm";
  }
  return String(Math.round(Math.hypot(dCol, dRow) * 10) / 10) + " px";
}

function syncTextScale() {
  ink.querySelectorAll("text.label").forEach((node) => {
    const size = Number(node.dataset.size) || 15;
    node.setAttribute("font-size", String(size / scale));
    node.setAttribute("stroke-width", String(size * 0.18 / scale));
  });
}

function bindShape(node, note) {
  node.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || event.ctrlKey || gridMode !== 1) return;
    event.stopPropagation();
    event.preventDefault();
    if (!isDraw(tool)) {
      drag = {
        id: event.pointerId,
        button: 0,
        mode: tool,
        x: event.clientX,
        y: event.clientY,
        originX: event.clientX,
        originY: event.clientY,
        moved: 0,
        markId: String(note.id),
        originCenter: Number(dragWindow().center),
        originWidth: Number(dragWindow().width) || 1,
        originFn: knownFunction(dragWindow().fn)
      };
      wrap.setPointerCapture(event.pointerId);
      return;
    }
    selected = note.id;
    const origin = clientToImage(event.clientX, event.clientY);
    move = {
      pointer: event.pointerId,
      id: note.id,
      x: event.clientX,
      y: event.clientY,
      originImage: origin,
      origin: note.points.map((point) => ({ x: point.x, y: point.y }))
    };
    node.setPointerCapture(event.pointerId);
    paintMarks();
    paintSelection();
  });
}

function moveNote(event) {
  const note = findNote(move.id);
  if (!note || !move.originImage) return;
  const now = clientToImage(event.clientX, event.clientY);
  if (!now) return;
  const dx = now.x - move.originImage.x;
  const dy = now.y - move.originImage.y;
  note.points = move.origin.map((point) => ({ x: point.x + dx, y: point.y + dy }));
  const node = ink.querySelector('[data-id="' + note.id + '"]');
  if (!node) return;
  if (note.type === "text") placeText(node, note);
  else {
    node.querySelectorAll("polygon, rect, ellipse, line").forEach((shape) => paintShape(shape, note));
    const label = node.querySelector("text");
    if (label && note.type === "length") placeLabel(label, note);
  }
  paintSelection();
}

function paintSelection() {
  ink.querySelectorAll("[data-chrome]").forEach((node) => node.remove());
  const note = findNote(selected);
  if (!note || gridMode !== 1 || !scale) return;
  const box = noteBounds(note);
  const pad = 4 / scale;
  const outer = document.createElementNS(SVGNS, "rect");
  const inner = document.createElementNS(SVGNS, "rect");
  outer.dataset.chrome = "1";
  inner.dataset.chrome = "1";
  for (const node of [outer, inner]) {
    node.setAttribute("x", String(box.x - pad));
    node.setAttribute("y", String(box.y - pad));
    node.setAttribute("width", String(box.width + pad * 2));
    node.setAttribute("height", String(box.height + pad * 2));
    node.setAttribute("fill", "none");
    node.setAttribute("pointer-events", "none");
    node.setAttribute("stroke-dasharray", "4 3");
    node.setAttribute("vector-effect", "non-scaling-stroke");
  }
  outer.setAttribute("stroke", "#000000");
  outer.setAttribute("stroke-width", "3");
  inner.setAttribute("stroke", "#ffffff");
  inner.setAttribute("stroke-width", "1");
  if (note.type === "text") {
    const point = note.points[0] || { x: 0, y: 0 };
    const transform = uprightTransform(point.x, point.y);
    outer.setAttribute("transform", transform);
    inner.setAttribute("transform", transform);
  }
  ink.append(outer, inner);
}

function pointsMoved(note, origin) {
  if (!note || !origin || note.points.length !== origin.length) return true;
  for (let index = 0; index < origin.length; index += 1) {
    const dx = note.points[index].x - origin[index].x;
    const dy = note.points[index].y - origin[index].y;
    if (dx * dx + dy * dy > 0.01) return true;
  }
  return false;
}

function noteBounds(note) {
  if (note.type === "text") {
    const point = note.points[0] || { x: 0, y: 0 };
    const pad = (note.size || 15) / scale;
    return { x: point.x, y: point.y - pad, width: Math.max(pad, String(note.text || "").length * pad * 0.6), height: pad };
  }
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  for (const point of note.points) {
    minX = Math.min(minX, point.x);
    minY = Math.min(minY, point.y);
    maxX = Math.max(maxX, point.x);
    maxY = Math.max(maxY, point.y);
  }
  return { x: minX, y: minY, width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY) };
}

function findNote(id) {
  const list = notes.get(noteKey(currentImage())) || [];
  return list.find((note) => note.id === Number(id)) || null;
}

function deleteSelected() {
  const key = noteKey(currentImage());
  const list = notes.get(key);
  if (!list || selected == null) return;
  notes.set(key, list.filter((note) => note.id !== selected));
  selected = null;
  renderInk();
  paintMarks();
}

function paintMarks() {
  const list = notes.get(noteKey(currentImage())) || [];
  marksEl.replaceChildren();
  if (!list.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "No marks on this image.";
    marksEl.append(empty);
  }
  for (const note of list) {
    const row = document.createElement("button");
    row.type = "button";
    row.className = "mark" + (note.id === selected ? " active" : "");
    const dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = note.color || currentColor;
    const label = document.createElement("span");
    label.textContent = kindName(note.type) + (note.type === "text" ? " " + String(note.text || "").slice(0, 24) : "");
    const drop = document.createElement("span");
    drop.className = "drop";
    drop.textContent = "×";
    drop.addEventListener("click", (event) => {
      event.stopPropagation();
      selected = note.id;
      deleteSelected();
    });
    row.append(dot, label, drop);
    row.addEventListener("click", () => {
      selected = note.id;
      renderInk();
      paintMarks();
    });
    marksEl.append(row);
  }
  const note = findNote(selected);
  selectedBox.hidden = !note;
  if (note) selectedKind.textContent = "Selected: " + kindName(note.type);
  document.getElementById("edit-text").hidden = !note || note.type !== "text";
  sizeRow.hidden = tool !== "text" && !(note && note.type === "text");
  syncSwatches();
  syncSizes();
  syncKey();
}

function kindName(type) {
  if (type === "contour") return "Freeform";
  if (type === "rect") return "Rectangle";
  if (type === "ellipse") return "Ellipse";
  if (type === "text") return "Text";
  return "Length";
}

function chooseColor(color) {
  currentColor = color;
  const note = findNote(selected);
  if (note) note.color = color;
  syncSwatches();
  if (note) renderInk();
}

function chooseSize(size) {
  currentSize = size;
  const note = findNote(selected);
  if (note && note.type === "text") {
    note.size = size;
    renderInk();
  }
  syncSizes();
}

function syncSwatches() {
  for (const button of swatches.querySelectorAll(".swatch")) {
    button.classList.toggle("on", button.dataset.color === currentColor);
  }
}

function syncSizes() {
  for (const button of sizeRow.querySelectorAll("[data-size]")) {
    button.classList.toggle("active", Number(button.dataset.size) === currentSize);
  }
}

function openNote(point, clientX, clientY) {
  stopPlay();
  editingId = null;
  pendingPoint = point;
  pendingKey = noteKey(currentImage());
  noteInput.hidden = false;
  noteInput.style.left = clientX + "px";
  noteInput.style.top = clientY + "px";
  noteInput.value = "";
  noteInput.focus();
}

function beginEdit(note) {
  stopPlay();
  editingId = note.id;
  pendingPoint = note.points[0];
  pendingKey = noteKey(currentImage());
  const rect = wrap.getBoundingClientRect();
  noteInput.hidden = false;
  noteInput.style.left = (rect.left + 24) + "px";
  noteInput.style.top = (rect.top + 24) + "px";
  noteInput.value = note.text || "";
  noteInput.focus();
}

function commitNote() {
  if (noteInput.hidden) return;
  const text = noteInput.value.trim();
  const point = pendingPoint;
  const key = pendingKey;
  const editing = editingId;
  pendingPoint = null;
  pendingKey = "";
  editingId = null;
  noteInput.value = "";
  noteInput.hidden = true;
  if (editing != null) {
    selected = editing;
    if (!text) {
      deleteSelected();
      return;
    }
    const note = findNote(editing);
    if (note) {
      note.text = text;
      note.color = note.color || currentColor;
      note.size = note.size || currentSize;
    }
    renderInk();
    paintMarks();
    return;
  }
  if (!text || !point || !key) return;
  addNote({ type: "text", points: [point], text, color: currentColor, size: currentSize }, key);
}

function cancelNote() {
  pendingPoint = null;
  pendingKey = "";
  editingId = null;
  noteInput.value = "";
  noteInput.hidden = true;
}

function toggleKey() {
  const image = currentImage();
  if (!image) return;
  const key = noteKey(image);
  if (keyImages.has(key)) keyImages.delete(key);
  else keyImages.add(key);
  renderSeries();
  syncKey();
}

function syncKey() {
  const image = currentImage();
  const on = image ? keyImages.has(noteKey(image)) : false;
  document.getElementById("key-image").classList.toggle("active", on);
}

function onKey(event) {
  if (event.key === "Escape") {
    if (document.fullscreenElement) return;
    if (!noteInput.hidden) {
      cancelNote();
      return;
    }
    if (!modal.hidden) closeModal();
    if (draft) {
      cancelDraft();
      return;
    }
    selected = null;
    renderInk();
    paintMarks();
    return;
  }
  if (!modal.hidden || draft || !noteInput.hidden) return;
  if (typingTarget(event)) return;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") {
    event.preventDefault();
    showIndex(viewIndex + 1);
  } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
    event.preventDefault();
    showIndex(viewIndex - 1);
  } else if (event.key === " ") {
    event.preventDefault();
    togglePlay();
  } else if (event.key === "Delete" || event.key === "Backspace") {
    if (selected != null) {
      event.preventDefault();
      deleteSelected();
    }
  } else if (event.key === "=" || event.key === "+") {
    event.preventDefault();
    zoomCentre(Math.exp(0.1));
  } else if (event.key === "-" || event.key === "_") {
    event.preventDefault();
    zoomCentre(Math.exp(-0.1));
  } else if (event.key === "0") {
    event.preventDefault();
    fitView();
  } else {
    const map = { s: "scroll", p: "pan", z: "zoom", w: "wl", f: "contour", r: "rect", e: "ellipse", t: "text", l: "length" };
    const next = map[event.key.toLowerCase()];
    if (next && event.key.length === 1) setTool(next);
  }
}

function zoomCentre(factor) {
  const rect = wrap.getBoundingClientRect();
  zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, factor);
}

function typingTarget(event) {
  const node = event.target;
  if (!node || !node.tagName) return false;
  if (node.tagName === "TEXTAREA") return true;
  if (node.tagName !== "INPUT") return false;
  const type = String(node.type || "text").toLowerCase();
  return type === "text" || type === "search";
}

function togglePlay() {
  if (playing) stopPlay();
  else startPlay();
}

function startPlay() {
  if (!currentImage()) return;
  playing = true;
  playButton.textContent = "Pause";
  playButton.classList.add("active");
  const token = ++playToken;
  const loop = async () => {
    while (playing && token === playToken) {
      const started = performance.now();
      await showIndex(viewIndex + 1);
      const fps = Number(fpsInput.value) || 10;
      const remain = 1000 / fps - (performance.now() - started);
      if (remain > 0) await delay(remain);
    }
  };
  loop();
}

function stopPlay() {
  playing = false;
  playToken += 1;
  playButton.textContent = "Play";
  playButton.classList.remove("active");
}

function delay(ms) {
  return new Promise((resolve) => { setTimeout(resolve, ms); });
}

function toggleFull() {
  if (!document.fullscreenEnabled) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else wrap.requestFullscreen();
}

async function openHeaders() {
  const image = currentImage();
  if (!image) return;
  const token = ++headerToken;
  const file = image.file;
  stopPlay();
  modal.hidden = false;
  filter.value = "";
  headerRows = [];
  headerRowsEl.replaceChildren();
  let response;
  try {
    response = await fetch("/headers", { method: "POST", body: file });
  } catch {
    if (token !== headerToken) return;
    showHeaderMessage("the headers could not be read");
    return;
  }
  if (token !== headerToken) return;
  if (!response.ok) {
    const message = await response.text();
    if (token !== headerToken) return;
    showHeaderMessage(message);
    return;
  }
  let rows;
  try {
    rows = await response.json();
  } catch {
    if (token !== headerToken) return;
    showHeaderMessage("the headers could not be read");
    return;
  }
  if (token !== headerToken) return;
  if (!Array.isArray(rows)) {
    showHeaderMessage("the headers could not be read");
    return;
  }
  headerRows = rows;
  paintHeaderRows();
}

function showHeaderMessage(message) {
  headerRowsEl.replaceChildren();
  const row = document.createElement("tr");
  const cell = document.createElement("td");
  cell.colSpan = 4;
  cell.textContent = message || "the headers could not be read";
  row.append(cell);
  headerRowsEl.append(row);
}

function paintHeaderRows() {
  const query = filter.value.trim().toLowerCase();
  headerRowsEl.replaceChildren();
  for (const item of headerRows) {
    const tag = item.tag || "";
    const vr = item.vr || "";
    const name = item.name || "";
    const value = item.value || "";
    if (query && !(tag + " " + vr + " " + name + " " + value).toLowerCase().includes(query)) continue;
    const row = document.createElement("tr");
    for (const field of [tag, vr, name, value]) {
      const cell = document.createElement("td");
      cell.textContent = field;
      row.append(cell);
    }
    headerRowsEl.append(row);
  }
}

function closeModal() {
  modal.hidden = true;
  headerToken += 1;
}

function currentWindowText(field) {
  const image = currentImage();
  const value = image && image.info ? image.info[field] : "";
  return String(value || "").split("\\")[0];
}

function knownFunction(text) {
  if (text === "LINEAR" || text === "LINEAR_EXACT" || text === "SIGMOID") return text;
  return "LINEAR";
}

function dragWindow() {
  if (draftWindow) return { center: draftWindow.center, width: draftWindow.width, fn: draftWindow.fn };
  if (shownWindow) return { center: shownWindow.center, width: shownWindow.width, fn: shownWindow.fn };
  if (overrideWindow) return { center: overrideWindow.center, width: overrideWindow.width, fn: overrideWindow.fn };
  return {
    center: Number(currentWindowText("windowCenter")) || 0,
    width: Number(currentWindowText("windowWidth")) || 1,
    fn: knownFunction(currentWindowText("windowFunction"))
  };
}
