name: CI

# THE CI FLOOR. NO GPU JOBS, DELIBERATELY.
#
# This is deviation D-04 in docs/hld/DEVIATIONS.md. HLD section 11 says every
# pull request renders the corpus in CI. GPU runners are expensive, so the
# corpus and the oracle run locally in `/verify` instead, and CI verifies the
# EVIDENCE rather than re-running the work.
#
# The `evidence` job below is what makes that honest. It costs no GPU and it
# cannot be satisfied by intention: the trailer it reads is written by
# .githooks/commit-msg from a ledger entry that a real gate run produced, and
# it must name the same tree hash as the commit it sits in.
#
# Do NOT add a GPU job here. If cheap GPU CI ever exists, revisit D-04 first
# so the deviation and the workflow change together.

on:
  push:
    branches: ["main", "sprint/**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Verification evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Head carries an Ocelli-Verify trailer for its own tree
        run: python3 scripts/verify_ledger.py check-commit HEAD

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # `gate native` step 4 runs scripts/target_feature_check.py. The runner
      # image ships a python3, and pinning it here means this job does not
      # depend on that staying true.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Story E1.7, the cross-target build proof. This is what keeps decision
      # D2 honest over time: if the core stopped being WebAssembly-agnostic,
      # it shows up here first.
      #
      # F-007 replaced two hand-written steps with the gate. The old pair built
      # ocelli-native on the host and checked ocelli-wasm for wasm32, which
      # left the other eleven crates unproved on both targets and said nothing
      # about feature resolution. Going through the gate also means CI and a
      # developer get ONE definition of the proof rather than a shell script
      # and a workflow that drift apart.
      - name: Cross-target proof
        run: bin/ocelli.sh gate native

  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Decision D2. The one that is worthless unless enforced.
      - run: ci/check-bindgen-isolation.sh
      # HLD section 31 and the section 38 hook. Only ocelli-render creates a
      # device. The compile-fail cases under crates/ocelli-compute/tests/ui/
      # are the strong half and run in the `test` gate. This catches the case
      # no type can: a crate creating a device it never puts in a GpuContext.
      - run: ci/check-device-ownership.sh
      # HLD 27.2 R5, two permitted files.
      - run: python3 scripts/unsafe_allowlist_check.py
      # HLD 15.2 and 27.2 R4, wgpu pinned exactly.
      - run: python3 scripts/pin_and_size_check.py
      # D-09. A wasm32 build still succeeds when a no_std crate reaches std.
      - run: python3 scripts/no_std_check.py
      # docs/SOURCE-POLICY.md and HLD gate A6. No allowlist.
      - run: python3 scripts/source_provenance_check.py
      - run: python3 scripts/staged_content_check.py --tracked
      - run: python3 scripts/prose_check.py
      - run: python3 scripts/deviation_check.py
      - run: python3 scripts/backlog_check.py
      - run: python3 scripts/gen_sprint_plan.py --check
      # One workflow, two hosts. A stale adapter serves Codex old instructions.
      - run: python3 scripts/sync_agent_skills.py --check
      # `gate --floor` calls itself "what CI runs". This is what makes that
      # true. S02 added three gates to the floor and each needed a hand-written
      # step here, and nothing would have noticed a missed one.
      - run: python3 scripts/ci_floor_check.py
      # The manifest's shape AND its coverage, neither of which needs the
      # corpus itself. `--coverage` calls load() first, so it subsumes
      # `--manifest-only` rather than replacing it. This is the half of the
      # corpus gate that survives D-04: a manifest that stops covering a
      # transfer syntax the codec registry claims, or stops covering one of
      # HLD 25.1's two tolerance classes, fails on the pull request instead
      # of at the moment someone tries to answer spike gate A1.
      - run: python3 scripts/corpus_check.py --coverage

  corpus-tooling:
    name: Corpus tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The generator writes real DICOM in every transfer syntax the codec
      # registry claims, so it needs real encoders. The Python environment is
      # the same locked uv environment used by developers. OpenJPH is pinned.
      # DCMTK is NOT, see the step below.
      - name: Python DICOM tooling
        run: |
          python3 -m pip install "uv==0.11.19"
          uv sync --locked

      # DCMTK comes from the distribution and is therefore NOT pinned. On
      # ubuntu-latest (24.04) that is 3.6.7, against the 3.7.0 that
      # corpus_synth.BUILT_WITH records. They do not agree and this comment is
      # not going to pretend they do.
      #
      # What follows from it, precisely: this job never compares a digest
      # against corpus/manifest.tsv. It generates into a temporary directory
      # and checks internal consistency, round-trips and byte-determinism
      # WITHIN one toolchain, none of which depends on the DCMTK version. What
      # a 3.6.7 here would break is regenerating the manifest, which is a local
      # operation on the machine that holds the corpus, and which
      # `python3 scripts/corpus_synth.py --tool-versions` guards. Running that
      # here would fail on this one row and tell nobody anything they can act
      # on, so it is deliberately not a step.
      #
      # Pinning it would mean building DCMTK from the 3.7.0 tag on every run.
      # If a DCMTK-version-sensitive defect ever appears, that is the fix.
      - name: DCMTK, for the four JPEG syntaxes pydicom cannot encode
        run: sudo apt-get update && sudo apt-get install -y dcmtk

      # TIFF support is explicitly off: OJPH_ENABLE_TIFF_SUPPORT defaults ON
      # in this tag and would need a libtiff development package that nothing
      # here installs. Nothing in this corpus reads or writes TIFF, the
      # generator feeds ojph_compress a PGM.
      - name: OpenJPH, for the three HTJ2K syntaxes
        run: |
          git clone --depth 1 --branch 0.31.0 \
            https://github.com/aous72/OpenJPH.git /tmp/openjph
          cmake -S /tmp/openjph -B /tmp/openjph/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOJPH_ENABLE_TIFF_SUPPORT=OFF
          cmake --build /tmp/openjph/build --parallel
          sudo cmake --install /tmp/openjph/build
          sudo ldconfig
          command -v ojph_compress

      # The hand-computed PS3.3 C.7.6.3.1.4 fixture, the byte-determinism
      # proof and the conformance assertions.
      #
      # NOT `bin/ocelli.sh gate corpus-tests`, deliberately. The gate runner
      # returns 0 when a gate skips, which is right for `docs` and `wasm`
      # whose skips are permanent, and wrong here: the three steps above exist
      # precisely to remove every reason to skip, so a skip in this job means
      # an install half-succeeded and the fixture did not run. That must be
      # red, not a green tick. `--require-prerequisites` says so, and it is
      # the same runner a developer gets through the gate.
      - run: uv run scripts/corpus_tests.py --require-prerequisites

  frontend:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Includes the cached-wasm-view ban of HLD 17.2, which is a silent
      # failure mode and therefore a lint rather than a convention.
      - run: npm run lint
      - run: npm run typecheck
      # Story E1.3. tsc proves the TypeScript compiles. This proves what a
      # CONSUMER receives: the tarball carries every path the exports map
      # advertises and both licence files, and a project outside the workspace
      # installs and imports it under bundler and node16 resolution. It also
      # runs `npm publish --dry-run`, which publishes nothing and which
      # scripts/package_check.py refuses to run where a token exists.
      - run: bin/ocelli.sh gate packages

  wasm:
    name: wasm size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0

      # Story E1.2's note is "CI fails if the module exceeds the agreed
      # budget", and a wasm-pack build needs no GPU. Release profile only:
      # HLD 15.2's opt-level "z", fat LTO and strip apply to release, so a
      # dev-profile measurement is meaningless against Appendix A gate A4.
      #
      # F-002 (E1.2) removed the skip that used to sit here. ocelli-wasm now
      # declares wasm-bindgen, wasm-pack builds it, and there is a release
      # artefact to measure, so this job runs the build rather than reporting
      # a skipped gate as a green tick.
      #
      # It still goes through the gate runner rather than calling wasm-pack
      # directly, so that the size check and the build stay one definition
      # that CI and a developer both get.
      - run: bin/ocelli.sh gate wasm
