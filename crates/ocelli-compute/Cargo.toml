[package]
name = "ocelli-compute"
description = "WGSL compute kernels. Shares the renderer's device, never creates one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Deviation D-10, same as ocelli-render.
#
# The dependency on ocelli-render is the direction HLD section 31 fixes:
# "ocelli-compute never creates a wgpu::Device; it borrows the one
# ocelli-render owns." It is not a cycle. The renderer CONSUMES compute
# results, it does not call kernels, and the caller that drives both is
# ocelli-viewport.
[dependencies]
ocelli-render = { path = "../ocelli-render" }
thiserror = { workspace = true }

# D-27. Same split as ocelli-render. This crate is not in the wasm-pack graph
# today. The workspace wasm32 check still unifies features, so a default wgpu
# line here would put the native backends back into that check.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "webgl"] }

# trybuild drives the compile-fail cases under tests/ui/. They are the payoff
# of the device-ownership contract: the defect stops COMPILING rather than
# being caught in review. Needs no GPU, so it runs in the CI floor.
[dev-dependencies]
trybuild = { workspace = true }
