[package]
name = "ocelli-compute"
description = "WGSL compute kernels. Shares the renderer's device, never creates one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

# Deviation D-10, same as ocelli-render.
#
# The dependency on ocelli-render is the direction HLD section 31 fixes:
# "ocelli-compute never creates a wgpu::Device; it borrows the one
# ocelli-render owns." It is not a cycle. The renderer CONSUMES compute
# results, it does not call kernels, and the caller that drives both is
# ocelli-viewport.
[dependencies]
ocelli-render = { path = "../ocelli-render" }
thiserror = { workspace = true }

# D-27. Same split as ocelli-render. This crate is not in the wasm-pack graph
# today. The workspace wasm32 check still unifies features, so a default wgpu
# line here would put the native backends back into that check.
#
# D-33, F-238. The table below is the D-27 native set minus `metal`, the one
# feature that reaches the objc2 crates on Apple, because this crate shares
# the renderer's device and must drop the same backend at the same time. It
# is deliberately NOT a forwarding feature like ocelli-render's `metal`:
# this crate is not in the shipped graph, `cargo tree -i ocelli-compute
# --workspace -e all` names no dependent, and a feature flag with no named
# user is forbidden, so there is nothing to forward to. The dev table below
# restores `metal` for the tests, and a future consumer that ships without
# Metal adds its own forwarding feature when it arrives, the way
# `ocelli-native` names `ocelli-render` today.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "gles", "vulkan", "wgsl", "webgpu"] }

# D-33's development half, same as ocelli-render's. The ui cases and the unit
# tests build this crate alone, and the union with the dependency above is the
# pinned default set. Dev-only, so it never enters a shipped graph.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "webgl"] }

# trybuild drives the compile-fail cases under tests/ui/. They are the payoff
# of the device-ownership contract: the defect stops COMPILING rather than
# being caught in review. Needs no GPU, so it runs in the CI floor.
[dev-dependencies]
trybuild = { workspace = true }
