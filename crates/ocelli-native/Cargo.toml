[package]
name = "ocelli-native"
description = "Desktop and server entry points. Phase 2 and 3, stubbed now."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Never published while stubbed. The policy lives in docs/RELEASE.md.
publish = false

[lints]
workspace = true

# HLD section 13. This crate exists in Phase 1 so that Phase 2 and Phase 3 are
# new ENTRY POINTS rather than new implementations. It stays stubbed, and
# F-007 (E1.7) proves the workspace still builds for a native target, which is
# the only thing that keeps decision D2 honest over time.
#
# ocelli-render arrives with F-004, and it is the operator override's NAMED
# USER. AGENTS.md forbids a feature flag with no named user, and an override
# nothing can exercise is exactly that. These two entry points read
# `OCELLI_TIER` and print the tier the resolver reached with the evidence it
# reached it on. The cost is that `bin/ocelli.sh native` step 1 starts linking
# wgpu, which is a real build-time change to a gate in the floor, and it is
# accepted because the alternative is shipping an override nobody can observe.
#
# The dependency is target-gated, and not for a wasm32 build that can never
# happen: the crate is `wasm: no` and its lib turns that cell into a
# compile_error. The gate keeps ocelli-render OUT of this crate's wasm32
# resolve, which is what leaves the `metal` forwarding feature below inert
# there. With the dependency present on wasm32, this crate's default feature
# would forward `wgpu/metal` onto the workspace's wasm32 resolve and fail the
# decode-graph guard, for a crate that is never compiled for that target.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ocelli-render = { path = "../ocelli-render" }

# D-33, F-238. The shipped native archive is this crate built with
# `--no-default-features`, which is the configuration `bin/ocelli.sh native`
# checks and the one whose resolved Apple graph must hold no objc2 crate. The
# default keeps Metal for development, so `cargo build -p ocelli-native` on
# the macOS host still resolves tier A the way `gate gpu` does. `gles` needs
# no forwarding: it stays a hard feature of ocelli-render's native table,
# because the F-238 measurement found that on Apple the `gles` chain never
# reaches wgpu-hal's own `gles`, which is the only feature there that names
# `dep:objc2`. See docs/lld/build-targets.md.
[features]
default = ["metal"]
metal = ["ocelli-render/metal"]

# Dev only. `AdapterFacts` states two of its fields in wgpu's own types, so a
# test that builds a synthetic adapter has to name them. Nothing outside
# `#[cfg(test)]` in this crate touches wgpu, and no device-creating call
# appears here at all, which `ci/check-device-ownership.sh` still asserts.
# Native tests only. A shared dev-dependency would enable the desktop
# backends on a wasm32 resolve of this crate.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "dx12", "metal", "gles", "vulkan", "wgsl", "webgpu"] }
