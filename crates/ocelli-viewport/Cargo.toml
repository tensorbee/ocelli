[package]
name = "ocelli-viewport"
description = "Viewport and scene model, camera, presentation state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# F-045. Pan is `Pt<Canvas>` from HLD section 16. This crate does not take wgpu.
ocelli-core = { path = "../ocelli-core" }
# `f64::sin_cos` is std-only, and this crate is `no_std`. glam's libm backend
# is the one `ocelli-pixel` already uses for the same reason. The workspace
# entry keeps default features off.
glam.workspace = true
# F-046. Presets call `VoiTransform::new` and rebuild `LutChain`. This crate
# does not take wgpu and does not depend on ocelli-render.
ocelli-pixel = { path = "../ocelli-pixel" }
# F-047. Scroll reads the decoded LRU. It does not build a second cache.
ocelli-cache = { path = "../ocelli-cache" }
# F-104. `ViewportState` and `RingHeader` are `#[repr(C)]` `bytemuck::Pod`
# layouts, so `write_state` and the ring copy a struct rather than restating
# its offsets. Section 15.2 already lists `bytemuck`.
bytemuck = { workspace = true }
# F-050. The snapshot record is JSON. D-26. The workspace entries are alloc
# only, so this crate keeps its no_std posture.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ocelli-core = { path = "../ocelli-core" }
ocelli-cache = { path = "../ocelli-cache" }
ocelli-pixel = { path = "../ocelli-pixel" }
