[package]
name = "ocelli-dicom"
description = "Parsing, transfer-syntax dispatch, metadata model and providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# D-18 keeps dicom-rs component defaults disabled. Deflate is a data-set
# encoding under PS3.5 A.5, so F-016 owns it. The parser component supplies the
# strict structural preflight. Pixel codec features do not belong to F-016.
dicom-core = { workspace = true }
dicom-object = { workspace = true }
dicom-encoding = { workspace = true }
dicom-parser = { workspace = true }
dicom-transfer-syntax-registry = { workspace = true }
flate2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
