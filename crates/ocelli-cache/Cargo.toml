[package]
name = "ocelli-cache"
description = "Budgeted LRU across encoded, decoded and GPU tiers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# F-032. The decoded tier's value type carries `ocelli-pixel`'s description and
# plane, and the section 17.3 event encoding is a `bytemuck` layout.
bytemuck = { workspace = true }
ocelli-pixel = { path = "../ocelli-pixel" }

[dev-dependencies]
# The two budget invariants of HLD section 20 are stated over random operation
# sequences, which is the `property` row of the workflow's test taxonomy.
# Dev-only, so it reaches neither the shipped surface nor `scripts/no_std_check.py`.
proptest = { workspace = true }
