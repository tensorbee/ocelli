[package]
name = "ocelli-geom"
description = "Hit-testing, projection, measurement mathematics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# F-070. A measurement takes `Pt<S>` and does not convert spaces.
ocelli-core = { path = "../ocelli-core" }
# `f64::sqrt` and `f64::atan2` are not in `core` here. The workspace glam
# entry already selects the libm backend. This is not a second math policy.
glam = { workspace = true }
