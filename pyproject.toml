[project]
name = "ocelli-tooling"
version = "0.0.0"
description = "Repository-local Python tooling for Ocelli"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.2",
    "openpyxl==3.1.5",
    "pydicom==3.0.2",
    "pyjpegls==1.5.1",
    "pylibjpeg==2.1.0",
    "pylibjpeg-libjpeg==2.4.0",
    "pylibjpeg-openjpeg==2.5.0",
    "pylibjpeg-rle==2.2.0",
    # The one dependency the CI FLOOR takes, and deviation D-17 records it.
    # `scripts/ci_floor_check.py` reads `.github/workflows/ci.yml` with a YAML
    # parser rather than line by line, because the S03 review's twelfth pass
    # measured four fail-open routes and five refusals of legitimate workflows
    # at the hand-rolled reader, and one of the four, key order, is not a
    # spelling a hand reader can refuse. This is the ONLY place the version is
    # written: the `guards` job in .github/workflows/ci.yml greps it out of
    # here rather than carrying a second copy.
    "pyyaml==6.0.3",
]

[tool.uv]
package = false
